# 后端 CI 质量门（GitHub Actions）——push 到仓库即自动跑（V78 评测驱动）
# 跑的是不依赖 GPU/LLM 的全部回归：mini_runner + bench selftest + highlight + 评估门 harness 自检。
#
# 【评估质量门 · 方案 P0 验证者】
#   CI（无模型）：python -m hashmm.evaluation.gate --stub   —— 自检案例可加载 + harness 接线（本文件已接）
#   测「正在运行的后端」（推荐·测用户实际走的路径，测试机无需模型/transformers）：
#     先起后端（AutoDL / 容器 / 打包 app 的本地后端默认 127.0.0.1:17680），再：
#     python -m hashmm.evaluation.gate --api http://127.0.0.1:17680 --gate 0.85 --baseline hashmm/evaluation/baseline.json
#     首次加 --update-baseline 写基线；需鉴权加 --token <jwt>。
#   真机直连管线（在配好 transformers+模型+索引的机器，如 AutoDL）：
#     python -m hashmm.evaluation.gate --gate 0.85 --baseline hashmm/evaluation/baseline.json --update-baseline
#   【V103.51 质量门 · LLM-as-judge】对带 judge/rubric 的案例追加「答得好不好」打分（有用性/完整性/落地/条理）：
#     默认开启；--api/--stream 模式会用同一后端的 /api/llm/tools 当 judge。关掉用 --no-judge，调阈值用 --judge-threshold 0.6。
#     judge 不可用（无模型/解析失败）时该维不计入，绝不因 judge 故障误判——契约仍是硬红线。
#   旧的 LLM bench 仍可用：python -m hashmm.tools.agent_bench --gate 0.8
name: backend-ci
on:
  push:
    paths: ["hashmm/**", "tests/**", "scripts/**"]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 后端回归（211+ 用例）
        run: python tests/_mini_runner.py
      - name: 长任务/长代码 长程行为硬合约（V306：上下文压缩·幻觉·漂移·无关污染）
        run: python tests/test_long_horizon.py
      - name: 忠实度合约（含 strict 硬事实接地：数字对不上/造年份/Big-O 写反判未接地）
        run: python tests/test_faithfulness_contract.py
      - name: 后端默认安全硬合约（V306：密钥生产从严·CORS 单一来源·限流小时窗）
        run: python tests/test_backend_security.py
      - name: CORS 真实 Origin 集成测试（白名单/预检/生产禁通配）
        run: python tests/test_cors_integration.py
      - name: 分层记忆去重护栏（否定/数字差异不误合）
        run: python tests/test_layered_dedup.py
      - name: 大厂级并发压力测试（真线程竞态·故障注入·幂等 exactly-once·LRU/黑板/队列/团队画布不变量）
        run: python tests/test_stress_concurrency.py
      - name: 端到端对话（真 agent loop + 真工具 + 真持久化 + 长对话）
        run: python tests/test_e2e_conversation.py
      - name: 工具管线边界压测（预算/迭代/守卫异常 fail-open/震荡/去重/瞬态分类）
        run: python tests/test_pipeline_boundary.py
      - name: 后端真实 HTTP 集成（TestClient 打真实中间件+鉴权：401/403/429/CORS/404/500）
        run: python tests/test_http_integration.py
      - name: 上下文压缩端到端（真 _compact_context + 真 loop 长历史不失忆）
        run: python tests/test_e2e_compaction.py
      - name: 多智能体团队 E2E（parallel/pipeline 两种模式 + 角色失败注入）
        run: python tests/test_team_e2e.py
      - name: 工具连环+中途压缩+幻觉 混合 E2E（真 loop + 工具老化 + 接地）
        run: python tests/test_e2e_tool_chain.py
      - name: 外部基准对标套件自检（注册表/运行器/leaderboard/工具调用/优雅降级/中枢注册）
        run: python tests/test_benchmarks.py
      - name: Bench harness 自检（脚本化 LLM 全链路）
        run: python -m hashmm.tools.agent_bench --selftest
      - name: 评估质量门 harness 自检（金标准案例可加载 + 接线）
        run: python -m hashmm.evaluation.gate --stub
      - name: 注入防御红队评测（V300：验证不可信区隔离 + 外泄闸，防线失效则 CI 红）
        run: python -m hashmm.evaluation.injection_redteam
      - name: 检索 IR 评测 harness 自检（Recall@k / nDCG / MRR 接线）
        run: python -m hashmm.evaluation.ir_eval --stub
      - name: 远程信令中继单测（自定义 runner，非 pytest 风格）
        run: python tests/test_remote_hub.py
      - name: 远程能力扩展单测（WOL + 文件传输纯逻辑）
        run: node desktop/services/test_remote-extensions.js
      - name: 前端高亮回归（61 项）
        run: node scripts/check_highlight.mjs
      - name: IPC sender 守卫（敏感通道来源校验）
        run: node desktop/tests-node/test_ipc-guard.js
      - name: IPC 契约（mock ipcMain 装 installGuard 验证敏感通道拦截真实生效）
        run: node desktop/tests-node/test_ipc_contract.js
      - name: preload/contextBridge 契约（暴露面最小化·零任意通道逃逸）
        run: node desktop/tests-node/test_preload_contract.js
      - name: 窗口导航白名单守卫
        run: node desktop/tests-node/test_nav-guard.js
      - name: 渲染前 HTML 危险内容净化（XSS 收口）
        run: node desktop/tests-node/test_xss_sanitize.js
      - name: 渲染净化 property-based fuzz（2 万随机 XSS 向量自动找绕过）
        run: node desktop/tests-node/test_xss_fuzz.js

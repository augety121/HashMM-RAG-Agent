# ruff 配置（S2-1 代码质量门禁）—— 保守起步，先建基线，不强制大改风格。
#
# 用法：
#   ruff check hashmm                # 看问题
#   ruff check hashmm --fix          # 自动修可修的（未使用导入、import 排序等）
#   ruff check hashmm --statistics   # 按规则统计存量
#
# 策略：先只开 E（pycodestyle 错误）、F（pyflakes 真问题：未用导入/未定义名等）、
# I（import 排序）。待存量清理后再逐步开 B/UP/SIM 等。

target-version = "py312"
line-length = 120          # 比默认 88 宽松，贴合现有代码风格，避免一次性重排

# 排除非源码目录
extend-exclude = [
    "frontend-next",
    "data",
    "backups",
    "tests/test_v1*.py",   # 历史 phase 测试（阶段快照，不强制 lint）
    "tests/test_llm_api.py",
]

[lint]
select = ["E", "F", "I"]

# 保守忽略：这些是风格偏好或与现有代码冲突的项，先不强制
ignore = [
    "E501",   # 行过长（line-length 已放宽，剩余超长先不强制）
    "E402",   # 模块级 import 不在顶部（项目有大量延迟 import 的合理用法）
    "E741",   # 单字符变量名（如 e/c，项目惯用）
    "F403",   # from module import *（聚合入口 security/__init__ 故意用）
    "F405",   # 可能来自 * 的未定义名（同上）
]

[lint.per-file-ignores]
# 聚合 re-export 入口：故意 import 不使用（对外暴露）
"hashmm/security/__init__.py" = ["F401"]
"hashmm/retrieval_group.py" = ["F401"]
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["hashmm"]

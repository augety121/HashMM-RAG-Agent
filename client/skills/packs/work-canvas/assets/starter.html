<!DOCTYPE html>
<!-- work-canvas 骨架：填 body，保留 [[PASTE canvas.css]] / [[PASTE canvas.js]] 标记，
     然后 python assets/assemble.py body.html out.html 装配成单文件。
     强制项：单文件自包含可离线 · 署名 footer · 「需要你拍板」只列真决策 ·
     编码颜色必配图例 · 非破坏（补丁只读 + 复制按钮，不改用户源文件）。
     暗色与 App 同源：<html class="dark">；宿主会通过 wc:theme 自动同步，无需手动。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标题 — 工作画布</title>
<style>
[[PASTE canvas.css]]
</style>
</head>
<body>
<div class="wc-container">

  <!-- 页头 -->
  <h1 class="wc-h1">标题：一句话说清这页是什么</h1>
  <p class="wc-sub">副题：读者看完该得出什么结论。</p>
  <div class="wc-meta">
    <span>生成 2026-01-01</span><span>·</span>
    <span>范围：N 项</span><span>·</span>
    <span>状态：进行中</span>
    <button class="wc-btn ghost" type="button" data-wc-theme style="margin-left:auto">深/浅色</button>
  </div>

  <!-- 需要你拍板（置顶；只列真正待人决策的事，没有就写「无」） -->
  <div class="wc-needs">
    <h2>需要你拍板</h2>
    <ol>
      <li>真实待决问题 1 —— 附上具体的下一步动作/命令。</li>
    </ol>
  </div>

  <!-- 正文区块：按 references/<类型>.md 的配方拼装 -->
  <div class="wc-section">
    <div class="wc-section-title">区块标题</div>
    <!-- wc-grid 指标 / wc-changed 变更 / wc-table 对比 / wc-timeline 时间线 … -->
  </div>

  <!-- 调整栏（可选；所改即所见，只动 CSS 变量） -->
  <div class="wc-tweaks">
    <span class="lbl">主色</span>
    <button class="wc-swatch on" type="button" data-wc-accent="#2563eb" style="background:#2563eb" aria-label="蓝"></button>
    <button class="wc-swatch" type="button" data-wc-accent="#7c3aed" style="background:#7c3aed" aria-label="紫"></button>
    <button class="wc-swatch" type="button" data-wc-accent="#059669" style="background:#059669" aria-label="绿"></button>
    <span class="lbl">密度</span>
    <span class="wc-seg">
      <button type="button" class="on" data-wc-density="cozy">舒适</button>
      <button type="button" data-wc-density="compact">紧凑</button>
    </span>
    <span class="lbl">字号</span>
    <input type="range" min="12" max="16" step="1" value="13" data-wc-fontsize aria-label="字号">
    <span class="lbl" data-wc-fontsize-out>13px</span>
  </div>

  <!-- 发回 agent（可选；宿主里回填输入框由用户确认发送，独立打开时给可粘贴文本） -->
  <form class="wc-composer" data-wc-composer>
    <div class="wc-section-title">发回 agent</div>
    <textarea placeholder="给 agent 的指令…" aria-label="给 agent 的指令"></textarea>
    <div class="wc-chips">
      <button class="wc-chip" type="button" data-text="接受当前方案，继续下一步。">接受方案</button>
    </div>
    <button class="wc-btn primary" type="submit">发送到输入框</button>
    <div class="wc-sent">已回填到聊天输入框，请确认后发送。</div>
    <div class="wc-paste">未检测到宿主，请复制后粘贴给 agent：<code></code></div>
  </form>

  <!-- 署名 footer（强制） -->
  <div class="wc-footer">
    由 HashMM agent · &lt;backbone model&gt; 生成 · 2026-01-01<br>
    单文件自包含 · 可离线打开 · 非破坏（本页产出均为可复制文本）
  </div>

</div>
<script>
[[PASTE canvas.js]]
</script>
</body>
</html>

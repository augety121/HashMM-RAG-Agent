# Docker Benchmarks → 回传后端（V332 重建版）
#
# ⚠️ 本文件曾在打包时随隐藏的 .github 目录丢失（Windows 拖拽上传不含隐藏文件夹），
#   V332 依据 tests/test_v326_ci_pipeline.py / test_v327_ci_secrets.py /
#   test_v328_ci_install.py 的全部结构断言重建，并新增：
#   ① 服务器上原本免 Docker 就能跑的 6 个基准（gaia/tau2/humaneval/bfcl/kotlin/webvoyager）
#      接入同一条 CI（别名 nodocker / all 与 install.sh、runner 同词汇）；
#   ② 并发输入：bench_workers（基准级）× concurrency（逐题级，HASHMM_BENCH_CONCURRENCY）；
#   ③ HASHMM_TB_TIMEOUT=19800（Terminal 50 题不再被 2h 默认值掐死）；
#   ④ actions/cache 缓存 BENCH_HOME —— 二次运行日志出现「数据集已存在，跳过下载（缓存命中）」。
#
# 若你 GitHub 仓库里已有同名 workflow，请以本文件覆盖（旧版不认 6 个新基准短名）。

name: Docker Benchmarks → 回传后端

on:
  workflow_dispatch:
    inputs:
      benches:
        description: "要跑的基准（空格分隔）：swebench terminal swebench_pro webarena osworld gaia tau2 humaneval bfcl kotlin webvoyager；别名 nodocker=免Docker六项 / all=全部11项"
        required: true
        default: "swebench"
      sample:
        description: "样本档位：quick=冒烟(分数不可比) / standard=50题(默认·可比口径) / full=官方全集(最贵)"
        type: choice
        options:
          - quick
          - standard
          - full
        default: standard
      baseline:
        description: "仅跑裸模型基线（paired_baseline 开启时忽略）"
        type: boolean
        default: false
      paired_baseline:
        description: "推荐：同一任务先跑裸模型再跑 Agent，自动产出可归因的成对结果（成本约 2 倍）"
        type: boolean
        default: true
      bench_workers:
        description: "基准级并发（同时跑几个基准，1~6；默认 2）"
        default: "2"
      concurrency:
        description: "逐题并发 HASHMM_BENCH_CONCURRENCY（付费云 API 可开 6~12；默认 6）"
        default: "6"

permissions:
  contents: read

env:
  # CI 在海外：数据集直连官方端点（install.sh 默认镜像是给国内服务器的）。
  HF_ENDPOINT: https://huggingface.co
  # BENCH_HOME 固定进 workspace，供 actions/cache 精确命中；install.sh 优先读本变量。
  HASHMM_BENCH_HOME: ${{ github.workspace }}/.bench-home

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub 免费 job 硬上限 360min，留 5min 给 Artifact 上传
    steps:
      # ── 第一步（在 checkout 之前）：预检 Secrets ──────────────────────────
      # V327 语义：模型三件套缺 BASE/MODEL 1 秒内失败，不白装依赖白下数据集；
      # KEY 缺是黄色警告（云 API 会逐题 401）；BACKEND_URL/TOKEN 是【可选】——
      # 服务器在内网收不到回传时自动切「仅出 Artifact」模式。
      - name: 预检 Secrets（缺模型配置 1 秒内失败，不浪费分钟数）
        env:
          HASHMM_OPENAI_BASE: ${{ secrets.HASHMM_OPENAI_BASE }}
          HASHMM_OPENAI_KEY: ${{ secrets.HASHMM_OPENAI_KEY }}
          HASHMM_OPENAI_MODEL: ${{ secrets.HASHMM_OPENAI_MODEL }}
          HASHMM_BACKEND_URL: ${{ secrets.HASHMM_BACKEND_URL }}
          HASHMM_BENCH_INGEST_TOKEN: ${{ secrets.HASHMM_BENCH_INGEST_TOKEN }}
          HASHMM_SERPER_API_KEY: ${{ secrets.HASHMM_SERPER_API_KEY }}
        run: |
          set -euo pipefail
          fail=0
          [ -n "${HASHMM_OPENAI_BASE:-}" ]  || { echo "::error::缺 Secret HASHMM_OPENAI_BASE（如 https://api.deepseek.com/v1）"; fail=1; }
          [ -n "${HASHMM_OPENAI_MODEL:-}" ] || { echo "::error::缺 Secret HASHMM_OPENAI_MODEL（如 deepseek-v4-pro）"; fail=1; }
          [ -n "${HASHMM_OPENAI_KEY:-}" ]   || echo "::warning::缺 HASHMM_OPENAI_KEY——云端 API 会逐题 401（本地 vLLM 可忽略）"
          if [ -z "${HASHMM_BACKEND_URL:-}" ] || [ -z "${HASHMM_BENCH_INGEST_TOKEN:-}" ]; then
            echo "ℹ️ 未配 HASHMM_BACKEND_URL / HASHMM_BENCH_INGEST_TOKEN —— 服务器在内网收不到回传，"
            echo "   本次自动切【仅出 Artifact】模式：跑完去运行页底部下载 bench-results，回内网导入。"
          fi
          if [ -z "${HASHMM_SERPER_API_KEY:-}" ]; then
            echo "::warning::未配 HASHMM_SERPER_API_KEY——gaia/webvoyager 会以「缺搜索 key」跳过（skip 原因照样落盘）"
          fi
          exit $fail

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -r requirements.txt

      # ── 数据集缓存：第一次成功后进 Actions 缓存，之后 install.sh 打印
      #   「数据集已存在，跳过下载（缓存命中）」——下载环节从此消失。──────────
      - name: 缓存基准数据集（BENCH_HOME）
        uses: actions/cache@v4
        with:
          path: ${{ env.HASHMM_BENCH_HOME }}
          key: bench-home-v332-${{ inputs.benches }}-${{ hashFiles('hashmm/evaluation/benchmarks/install.sh', 'scripts/fetch_datasets.py') }}
          restore-keys: |
            bench-home-v332-

      # ── 下载/安装（V328 严格模式：四层吞错已拆，任何安装失败当场红）─────────
      #   · set -o pipefail：防 tee 吃掉退出码（吞错换马甲）；
      #   · 每个基准 ::group:: 分组日志并 tee 到 install-logs/（永远上传成 Artifact）；
      #   · 步骤末尾打印 BENCH_HOME 产物一览——数据到底下没下载，一眼看清。
      - name: 下载基准数据集（严格模式）
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p install-logs
          BENCHES="${{ inputs.benches }}"
          # 别名展开（与 scripts/remote_bench_runner.py 的 _ALIASES 同词汇；drift 由测试锁定）
          BENCHES="${BENCHES//nodocker/humaneval bfcl tau2 gaia kotlin webvoyager}"
          BENCHES="${BENCHES//all/swebench terminal swebench_pro webarena osworld humaneval bfcl tau2 gaia kotlin webvoyager}"
          # 去重保序
          DEDUP=""
          for b in $BENCHES; do
            case " $DEDUP " in *" $b "*) ;; *) DEDUP="$DEDUP $b" ;; esac
          done
          echo "本次安装目标：$DEDUP"
          for b in $DEDUP; do
            echo "::group::install $b"
            bash hashmm/evaluation/benchmarks/install.sh "$b" 2>&1 | tee "install-logs/$b.log"
            echo "::endgroup::"
          done
          echo ""
          echo "════════ BENCH_HOME 产物一览 ════════"
          ls -la "$HASHMM_BENCH_HOME" || echo "（BENCH_HOME 不存在——安装步骤没产出任何东西）"

      - name: 上传安装日志（装失败也能看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs
          path: install-logs/
          if-no-files-found: ignore

      # ── 跑分（基准级 × 逐题级双层并发；结果无论成败都落盘 bench_results/）────
      - name: 运行基准并回传
        env:
          HASHMM_OPENAI_BASE: ${{ secrets.HASHMM_OPENAI_BASE }}
          HASHMM_OPENAI_KEY: ${{ secrets.HASHMM_OPENAI_KEY }}
          HASHMM_OPENAI_MODEL: ${{ secrets.HASHMM_OPENAI_MODEL }}
          HASHMM_BACKEND_URL: ${{ secrets.HASHMM_BACKEND_URL }}
          HASHMM_BENCH_INGEST_TOKEN: ${{ secrets.HASHMM_BENCH_INGEST_TOKEN }}
          HASHMM_SERPER_API_KEY: ${{ secrets.HASHMM_SERPER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HASHMM_BENCH_CONCURRENCY: ${{ inputs.concurrency }}
          # Terminal 50 题在 2h 默认值下常被掐死且不留 results.json；job 上限 6h → 给 5.5h。
          HASHMM_TB_TIMEOUT: "19800"
          HASHMM_CI_NAME: github_actions
        run: |
          set -euo pipefail
          if [ -n "${HASHMM_SERPER_API_KEY:-}" ]; then
            export HASHMM_SEARCH_BACKEND=serper
          fi
          ARGS="--bench ${{ inputs.benches }} --sample ${{ inputs.sample }} --bench-workers ${{ inputs.bench_workers }} --out-dir bench_results"
          if [ "${{ inputs.paired_baseline }}" = "true" ]; then
            ARGS="$ARGS --paired-baseline"
          elif [ "${{ inputs.baseline }}" = "true" ]; then
            ARGS="$ARGS --baseline"
          fi
          echo "▶ python scripts/remote_bench_runner.py $ARGS"
          python scripts/remote_bench_runner.py $ARGS

      - name: 上传跑分结果（bench-results；skip 也带原因）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench_results/
          if-no-files-found: warn

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浏览器执行记录</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f6f7f8;--surface:#fff;--soft:#f3f4f6;--line:#e4e6e9;
    --ink:#17181a;--muted:#686d76;--faint:#969ba5;--blue:#2563eb;
    --red:#c9362b;--amber:#9a6700;
    font-family:ui-sans-serif,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif
  }
  *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink)}
  button{font:inherit}
  .shell{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr) 34px}
  header{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface)}
  .mark{width:30px;height:30px;border-radius:9px;background:var(--blue);position:relative}
  .mark:after{content:"";position:absolute;inset:7px;border-radius:4px;background:#fff}
  .heading{min-width:0}.heading strong{display:block;font-size:14px}.heading span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .actions{display:flex;gap:8px;margin-left:auto}
  .button{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 11px;color:var(--ink);cursor:pointer}
  .button:hover{background:var(--soft)}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:var(--soft);font-size:12px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .status.live{color:#126c3a;background:#eaf7ef}.status.live .dot{background:#1f9d55}
  .status.wait{color:var(--amber);background:#fff7df}.status.wait .dot{background:#c48a00}
  main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px}
  .panel{min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .viewer{display:grid;grid-template-rows:43px minmax(0,1fr)}
  .address{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
  .address .url{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--soft);border-radius:8px;padding:7px 10px}
  .viewport{position:relative;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
  #shot{width:100%;height:100%;object-fit:contain;object-position:top center;display:none}
  .empty{max-width:460px;text-align:center;padding:28px;color:var(--muted);line-height:1.65}
  .empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
  .trace{display:grid;grid-template-rows:44px minmax(0,1fr)}
  .trace h2{font-size:13px;margin:0;padding:14px;border-bottom:1px solid var(--line)}
  #feed{overflow:auto;padding:8px}.event{padding:10px;border-radius:9px;margin-bottom:6px;background:var(--soft)}
  .event-head{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:650}.event-head time{margin-left:auto;color:var(--faint);font-weight:400}
  .event-detail{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px;word-break:break-word}
  .error{color:var(--red)}
  footer{padding:8px 16px;border-top:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted)}
  @media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:minmax(260px,1fr) 220px}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="mark" aria-hidden="true"></div>
    <div class="heading">
      <strong>浏览器执行记录</strong>
      <span id="subtitle">正在检查安全桥</span>
    </div>
    <div class="actions">
      <button class="button primary" id="show" type="button">显示受控页面</button>
      <button class="button" id="clear" type="button">清空记录</button>
    </div>
    <div class="status wait" id="status"><span class="dot"></span><span id="statusText">连接中</span></div>
  </header>
  <main>
    <section class="panel viewer">
      <div class="address"><span>页面</span><div class="url" id="url">about:blank</div></div>
      <div class="viewport">
        <div class="empty" id="empty"><strong>等待真实浏览器动作</strong>这里仅展示受控浏览器返回的截图和状态，不生成模拟页面或演示轨迹。</div>
        <img id="shot" alt="受控浏览器的实际页面截图">
      </div>
    </section>
    <aside class="panel trace">
      <h2>动作轨迹 <span id="count">0 步</span></h2>
      <div id="feed"><div class="empty">尚无真实动作。</div></div>
    </aside>
  </main>
  <footer>网页、命令输出和上传内容均按不可信数据处理；只有安全桥回传的运行事件会显示在这里。</footer>
</div>
<script>
"use strict";
(() => {
  const byId = (id) => document.getElementById(id);
  const bridge = window.hashmmBrowserCockpit || null;
  const events = [];
  const labels = {navigate:"打开页面",click:"点击",type:"输入",key:"按键",scroll:"滚动",read:"读取",back:"后退",forward:"前进",wait:"等待"};
  const escapeText = (value) => String(value == null ? "" : value)
    .replace(/[&<>"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));

  function setStatus(kind, text) {
    byId("status").className = "status " + kind;
    byId("statusText").textContent = text;
  }
  function render() {
    byId("count").textContent = events.length + " 步";
    if (!events.length) {
      byId("feed").innerHTML = '<div class="empty">尚无真实动作。</div>';
      return;
    }
    byId("feed").innerHTML = events.map((event) => {
      const failed = event.phase === "error";
      const action = labels[event.action] || event.action || "浏览器动作";
      const detail = event.error || event.note || event.label || event.url || "";
      return '<div class="event"><div class="event-head ' + (failed ? "error" : "") + '">' +
        escapeText(action) + '<time>' + escapeText(event.phase || "done") + '</time></div>' +
        (detail ? '<div class="event-detail">' + escapeText(detail) + '</div>' : "") + '</div>';
    }).join("");
  }
  function accept(event) {
    if (!event) return;
    if (event.url) byId("url").textContent = event.url;
    if (event.image) {
      byId("shot").src = event.image;
      byId("shot").style.display = "block";
      byId("empty").style.display = "none";
    }
    if (event.phase === "start") {
      setStatus("wait", "执行中");
      return;
    }
    if (event.phase === "session") {
      setStatus("", "空闲");
      return;
    }
    if (event.phase === "done" || event.phase === "error") {
      events.push(event);
      if (events.length > 200) events.shift();
      setStatus(event.phase === "error" ? "wait" : "live", event.phase === "error" ? "已拦截" : "已记录");
      render();
    }
  }

  if (!bridge || typeof bridge.state !== "function" || typeof bridge.onEvent !== "function") {
    byId("subtitle").textContent = "安全桥不可用";
    byId("show").hidden = true;
    byId("clear").hidden = true;
    byId("empty").innerHTML = "<strong>浏览器执行桥未连接</strong>当前窗口不会使用脚本演示替代真实执行。请从 HashMM 桌面端重新打开浏览器执行记录。";
    setStatus("wait", "不可用");
    return;
  }

  byId("subtitle").textContent = "实时模式 · 安全桥已连接";
  setStatus("", "空闲");
  byId("show").addEventListener("click", async () => {
    const result = await bridge.showControlled();
    if (!result || !result.ok) setStatus("wait", "页面未启动");
  });
  byId("clear").addEventListener("click", async () => {
    await bridge.clearTrace();
    events.length = 0;
    render();
  });
  bridge.state().then((state) => {
    ((state && state.events) || []).filter((event) => event.phase === "done" || event.phase === "error").forEach(accept);
    if (state && state.session && state.session.active) setStatus("live", "会话中");
  }).catch(() => setStatus("wait", "状态不可用"));
  bridge.onEvent(accept);
})();
</script>
</body>
</html>

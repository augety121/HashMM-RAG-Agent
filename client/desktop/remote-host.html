<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>HashMM 投屏端</title></head>
<body style="margin:0;background:#000;color:#666;font-family:sans-serif">
<div style="padding:8px;font-size:12px" id="log">HashMM 投屏渲染进程（隐藏窗口）。捕获屏幕并通过 WebRTC P2P 推送给查看端。</div>
<video id="self" autoplay muted playsinline style="display:none"></video>
<script>
"use strict";
// HashMM 投屏端（被控端的「屏幕提供者」），跑在隐藏的 Electron BrowserWindow 里。
// getDisplayMedia 屏幕捕获与 RTCPeerConnection（Chromium 硬件编码 VP8/VP9/H.264、ICE/STUN 穿透、
// DTLS-SRTP 加密）只在渲染进程可用。两种模式：
//   · 局域网(lan)：连本机 remote-server（凭 hostToken 注册），offer/answer/ICE 经本机 WS 中继。
//   · 账号(account)：连**公网账号后端**的信令中继（凭账号 token 认证为 host），同账号设备可跨网络发现并直连。
// 两模式协议一致（viewerJoined / rtcSignal{vid} / viewerLeft）。账号模式下，viewer 的输入由后端中继到
// 本页，再经 IPC 交给主进程的 cu-driver 注入（渲染进程不能直接注入系统输入）。

const qs = new URLSearchParams(location.search);
const MODE = qs.get("mode") || "lan";           // lan | account
const PORT = qs.get("port") || "17690";
let TOKEN = "";                                // secret arrives over the narrow preload bridge
let SOCKET_TICKET = "";                        // V1800 single-use 30s WebSocket admission ticket
const SIGNAL = qs.get("signal") || "";          // account 模式的后端信令 wss
const NAME = qs.get("name") || "被控端";
let DEVICE_ID = "";
let APP_VERSION = "";
try {
  DEVICE_ID = localStorage.getItem("hmm_remote_device_id") || "";
  if (!DEVICE_ID) {
    DEVICE_ID = "desktop-" + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
    localStorage.setItem("hmm_remote_device_id", DEVICE_ID);
  }
} catch (_e) { DEVICE_ID = "desktop-" + Math.random().toString(36).slice(2); }
const logEl = document.getElementById("log");
const log = (s) => { try { logEl.textContent = s; } catch (_e) {} };

let ipc = (window.hashmmRemoteHost && window.hashmmRemoteHost.ipc) || null;
const reportHostStatus = (state, detail) => {
  if (!ipc) return;
  try {
    ipc.send("remote-host-status", {
      state: String(state || "unknown"),
      registered: state === "registered",
      deviceId: DEVICE_ID,
      detail: String(detail || "").slice(0, 240),
      at: Date.now(),
    });
  } catch (_e) {}
};
try { if (ipc) ipc.on("remote-host-bootstrap", (_e, payload) => {
  const t = payload && payload.token;
  const ticket = payload && payload.ticket;
  if ((!t || typeof t !== "string") && (!ticket || typeof ticket !== "string")) return;
  TOKEN = (t && typeof t === "string") ? t : "";
  SOCKET_TICKET = (ticket && typeof ticket === "string") ? ticket : "";
  if (payload && payload.deviceId) DEVICE_ID = String(payload.deviceId).slice(0, 128);
  if (payload && payload.appVersion) APP_VERSION = String(payload.appVersion).slice(0, 40);
  reportHostStatus("media_ready");
  if (MODE !== "account" && (!ws || ws.readyState > 1)) connect();
}); } catch (_e) {}
// Renderer readiness is an explicit handshake.  did-finish-load alone can race
// preload/listener installation on slower packaged Windows machines.
try { if (ipc) ipc.send("remote-host-ready", { at: Date.now(), mode: MODE }); } catch (_e) {}
// V105 远程常驻在线：主进程会随 Supabase token 刷新把【新令牌】推过来，这里热更新 TOKEN。
// 原因：本窗启动时拿到的 access_token 约 1 小时就过期，过期后 presence 上报会 401 静默失败，
// 设备在手机端「我的设备」里 45s 后消失 —— 这就是「过一段时间远程界面里没东西」的根因。
try { if (ipc) ipc.on("remote-host-token", (_e, t) => {
  if (t && typeof t === "string" && t.length > 20) {
    TOKEN = t;
    if (_signalAuthRejected) {
      _signalAuthRejected = false; _signalReconnectAttempt = 0;
      try { if (!ws || ws.readyState > 1) connect(); } catch (_e2) {}
    }
  }
}); } catch (_e) {}
try { if (ipc) ipc.on("remote-host-access-decision", (_e, decision) => {
  if (!decision || !decision.sessionId || !signalReady()) return;
  signalSend({ type: "permissionDecision", sessionId: decision.sessionId,
    decision: decision.decision === "approve" ? "approve" : "deny",
    scopes: Array.isArray(decision.scopes) ? decision.scopes : [] });
}); } catch (_e) {}
// V103.90 远控自适应质量/编码偏好策略（纯逻辑模块；缺失则退回静态质量，不影响连接）。
let RQ = (window.hashmmRemoteHost && window.hashmmRemoteHost.quality) || null;
// V103.90 远控控制协议（结构化+版本化+校验；缺失则退回旧 {type:"input"} 直通）。
let RP = (window.hashmmRemoteHost && window.hashmmRemoteHost.protocol) || null;
// V103.90 远控扩展控制器（双向剪贴板同步等）。
let _clip = (window.hashmmRemoteHost && window.hashmmRemoteHost.clipboard) || null;
const _clipSync = _clip ? { onLocalChange: (text) => _clip.onLocalChange(text), onRemoteData: (data) => _clip.onRemoteData(data) } : null;

// V103.51 隐私防护：被控端把发出的视频轨替换为黑屏（停止泄露屏幕内容）。
// 真正锁本地键鼠由主进程在注入链处拒绝注入（_remotePrivacyOn）；这里只管「别人看到的画面」。
let _privacyOn = false, _blackTrack = null;
function _makeBlackTrack() {
  try {
    const c = document.createElement("canvas"); c.width = 1280; c.height = 720;
    const g = c.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "#666"; g.font = "28px sans-serif"; g.textAlign = "center";
    g.fillText("隐私模式已开启 · 屏幕已对远端隐藏", c.width / 2, c.height / 2);
    const s = c.captureStream(1);
    return s.getVideoTracks()[0] || null;
  } catch (_e) { return null; }
}
function _applyPrivacyToSenders(on) {
  _privacyOn = on;
  let real = null;
  try { real = (stream && stream.getVideoTracks && stream.getVideoTracks()[0]) || null; } catch (_e) {}
  if (on && !_blackTrack) _blackTrack = _makeBlackTrack();
  const useTrack = on ? _blackTrack : real;
  if (!useTrack) return;
  for (const pc of pcs.values()) {
    try { const sender = pc.getSenders().find(s => s.track && s.track.kind === "video"); if (sender) sender.replaceTrack(useTrack); } catch (_e) {}
  }
}
if (ipc) {
  ipc.on("remote-set-privacy", (_e, on) => { try { _applyPrivacyToSenders(!!on); log(on ? "隐私模式：屏幕已对远端隐藏" : "隐私模式已关闭"); } catch (_e2) {} });
  // V103.52 主进程 → 经信令把文件/多屏的回复发回指定 viewer
  ipc.on("remote-host-reply", (_e, payload) => {
    try { if (signalReady() && payload && payload.type) signalSend(payload); } catch (_e2) {}
  });
  ipc.on("remote-set-quality", (_e, q) => {
    // 调整发送编码码率/帧率上限（真彩=高码率）。失败静默，不影响连接。
    // V103.90：手动设置后暂停自适应 20s，避免自动档位立刻把手动值覆盖掉。
    _autoPausedUntil = Date.now() + 20000;
    try {
      const maxFr = Math.max(1, Math.min(30, (q && q.fps) || 8));
      const kbps = (q && q.jpeg >= 85) ? 4000 : (q && q.jpeg >= 65) ? 2000 : 1000;
      for (const pc of pcs.values()) {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
        if (!sender || !sender.getParameters) continue;
        const p = sender.getParameters(); p.encodings = p.encodings && p.encodings.length ? p.encodings : [{}];
        p.encodings[0].maxFramerate = maxFr; p.encodings[0].maxBitrate = kbps * 1000;
        sender.setParameters(p).catch(() => {});
      }
    } catch (_e2) {}
  });
}

let stream = null, iceServers = [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }];
let _audioOn = false;       // 远端是否听本机声音（默认关，按需由 viewer 控制开启）
let _relayOnly = false;     // 安全中转(Beta)：强制经 TURN 中转，不暴露 P2P 直连 IP
const pcs = new Map();              // vid -> RTCPeerConnection
let manualPC = null;
let ws = null;
let _accountSignalReady = false;
let _signalReconnectAttempt = 0, _signalReconnectTimer = null, _signalAuthRejected = false, _signalGeneration = 0;

function signalReady() { return MODE === "account" ? _accountSignalReady : !!(ws && ws.readyState === 1); }
function signalSend(payload) {
  try {
    if (MODE === "account") {
      if (!ipc || !_accountSignalReady) return false;
      ipc.send("remote-host-signal-send", payload);
      return true;
    }
    if (!ws || ws.readyState !== 1) return false;
    ws.send(typeof payload === "string" ? payload : JSON.stringify(payload));
    return true;
  } catch (_e) { return false; }
}
function sendMilestone(vid, milestone, detail) {
  const sessionId = _sessionByViewer.get(vid) || _relaySessionId || "";
  if (!sessionId) return false;
  return signalSend({ type: "milestone", vid, sessionId, milestone, detail: detail || {} });
}
try { if (ipc) ipc.on("remote-host-signal-state", (_e, state) => {
  _accountSignalReady = !!(state && state.registered);
  if (state && state.state === "registered") log("被控端已就绪，等待连接请求…");
  else if (state && state.state === "reconnecting") log("远程控制通道正在恢复…");
  else if (state && (state.state === "error" || state.state === "rejected" || state.state === "auth_expired")) {
    log("远程主机注册失败：" + String(state.detail || state.state));
  }
}); } catch (_e) {}

async function ensureStream() {
  if (stream) return stream;
  const video = { frameRate: { ideal: 30, max: 60 }, width: { ideal: 1920 }, height: { ideal: 1080 } };
  // 优先连系统声音一起采集；不支持/被拒就回退到无声（绝不因声音失败而丢画面）。
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video, audio: true });
  } catch (_e1) {
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video, audio: false });
    } catch (_e2) {
      hlog("getDisplayMedia 失败（抓不到屏 → 黑屏）：" + ((_e2 && _e2.message) || _e2));
      throw _e2;
    }
  }
  try {
    const vt = stream.getVideoTracks()[0];
    const st = (vt && vt.getSettings) ? vt.getSettings() : {};
    hlog("抓屏成功 " + (st.width || "?") + "x" + (st.height || "?") +
         " 视频轨=" + stream.getVideoTracks().length + " 音频轨=" + stream.getAudioTracks().length +
         " 视频轨状态=" + (vt ? vt.readyState : "无"));
  } catch (_e) {}
  // 音频轨默认按当前开关状态（默认静音）；开关切换只改 track.enabled，无需重协商。
  try { const at = stream.getAudioTracks()[0]; if (at) at.enabled = _audioOn; } catch (_e) {}
  document.getElementById("self").srcObject = stream;
  return stream;
}
// 被控端诊断：把抓屏/推流状态 POST 到后端日志（黑屏排障用，用户分享后端日志即可看到）。
function hlog(msg) {
  try {
    console.log("[host-diag]", msg);
    const base = _relayHttpBase();
    if (!base || !_relaySessionId || !_relayTicket) return;
    fetch(base + "/api/remote/relay/hostlog", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Remote " + _relayTicket },
      body: JSON.stringify({ msg: String(msg), room: _relaySessionId }),
      keepalive: true,
    }).catch(() => {});
  } catch (_e) {}
}
// ── 帧中继兜底（仅账号模式）：把屏幕以低帧率 JPEG 推到后端，供 P2P/TURN 打不通的查看端 GET 拉取。
// 不依赖 WebRTC 是否连通；中继 room 使用批准后的 session id，凭短时 host ticket 推帧。
let _relayPushTimer = null, _relaySessionId = "", _relayTicket = "", _relayViewerId = "";
let _compatPreviewRequested = false;
let _legacyRelayDelayMs = 12000;
const _relayFallbackTimers = new Map();
const _sessionByViewer = new Map();
const _lastControlSeqByViewer = new Map();
const _fileChannelsByViewer = new Map();
function _relayHttpBase() {
  // 账号模式优先用主进程传入的后端地址（与查看端 App 同一后端）；否则从 SIGNAL(WS) 派生。
  try { const ab = qs.get("apiBase"); if (ab) return ab.replace(/\/+$/, ""); } catch (_e) {}
  if (!SIGNAL) return "";
  try { return SIGNAL.replace(/^ws/, "http").replace(/\/api\/remote\/(?:v\d+\/)?ws.*$/, ""); } catch (_e) { return ""; }
}
function startRelayPush() {
  if (_relayPushTimer) return;
  const base = _relayHttpBase();
  if (!base || !_relaySessionId || !_relayTicket) { console.warn("[relay] 尚无已批准会话，暂不推帧"); return; }
  console.log("[relay] 开始推帧到", base, "room=", _relaySessionId);
  const cvs = document.createElement("canvas");
  const ctx = cvs.getContext("2d");
  const vid = document.getElementById("self");
  let busy = false;
  let _diagPushed = false;
  let _diagFailLogged = false;
  let _delay = 2500;            // 没人看时只 ~0.4fps 探测一帧，避免日志/上行刷屏；有人看立刻提到 ~4fps
  const pump = async () => {
    // P2P(WebRTC)直连在用 → 查看端走直连拿画面，中继完全不需要，直接一帧都不推（后端日志彻底不刷屏）。
    let p2pLive = false;
    try { pcs.forEach((pc) => { if (pc && pc.connectionState === "connected") p2pLive = true; }); } catch (_e) {}
    if ((!p2pLive || _compatPreviewRequested) && !busy && stream && !_privacyOn) {  // 兼容预览在直连“已连接但无首帧”时仍须可用
      const w = vid.videoWidth || 0, h = vid.videoHeight || 0;
      if (w && h) {
        busy = true;
        try {
          const scale = Math.min(1, 1280 / Math.max(w, h));  // 长边 ~1280，控制单帧体积与上行
          cvs.width = Math.round(w * scale); cvs.height = Math.round(h * scale);
          ctx.drawImage(vid, 0, 0, cvs.width, cvs.height);
          const blob = await new Promise((res) => cvs.toBlob(res, "image/jpeg", 0.6));
          if (blob) {
            const r = await fetch(base + "/api/remote/relay/" + encodeURIComponent(_relaySessionId) + "/push", {
              method: "POST",
              headers: { "Authorization": "Remote " + _relayTicket, "Content-Type": "image/jpeg" },
              body: blob,
            });
            if (r && r.ok) {
              // 后端回报「现在有没有人在看」：有人看→250ms(~4fps)；没人看→2.5s 探测一帧（日志不再刷屏）。
              let watching = false;
              try { watching = !!(await r.json()).watching; } catch (_e) {}
              _delay = watching ? 250 : 2500;
              if (!_diagPushed) {
                _diagPushed = true;
                sendMilestone(_relayViewerId, "fallback_first_frame", { stage: "compat_preview", width: cvs.width, height: cvs.height });
                hlog("兼容预览首帧已推送 " + cvs.width + "x" + cvs.height);
              }
            } else if (!_diagFailLogged && r) {
              _diagFailLogged = true;
              const code = r.status === 401 ? "RELAY_HTTP_401" : r.status === 403 ? "RELAY_HTTP_403" : r.status === 404 ? "RELAY_HTTP_404" : "RELAY_HOST_NOT_PUSHING";
              sendMilestone(_relayViewerId, "terminal_error", { stage: "compat_preview", errorCode: code });
              hlog("兼容预览推帧 HTTP " + r.status);
            }
          }
        } catch (_e) {
          if (!_diagFailLogged) {
            _diagFailLogged = true;
            sendMilestone(_relayViewerId, "terminal_error", { stage: "compat_preview", errorCode: "RELAY_REQUEST_TIMEOUT" });
            hlog("兼容预览推帧异常：" + ((_e && _e.message) || _e));
          }
        }
        busy = false;
      }
    }
    // P2P 在用时只本地复查（不发任何请求），3 秒一次；P2P 断了立刻回到正常中继节奏。
    _relayPushTimer = setTimeout(pump, (p2pLive && !_compatPreviewRequested) ? 3000 : _delay);
  };
  _relayPushTimer = setTimeout(pump, 0);
}
function stopRelayPush() {
  if (_relayPushTimer) clearTimeout(_relayPushTimer);
  _relayPushTimer = null;
}
function cancelRelayFallback(vid) {
  const timer = _relayFallbackTimers.get(vid);
  if (timer) clearTimeout(timer);
  _relayFallbackTimers.delete(vid);
}
function scheduleRelayFallback(vid, delayMs) {
  cancelRelayFallback(vid);
  const delay = Math.max(0, Number.isFinite(Number(delayMs)) ? Number(delayMs) : _legacyRelayDelayMs);
  _relayFallbackTimers.set(vid, setTimeout(() => {
    _relayFallbackTimers.delete(vid);
    const pc = pcs.get(vid);
    if (pc && pc.connectionState === "connected") return;
    if (vid !== _relayViewerId) return;
    hlog("ICE 直连/TURN 尚未建立，启动兼容画面预览");
    sendMilestone(vid, "fallback_started", { stage: "compat_preview" });
    startRelayPush();
  }, delay));
}

function makePC(onIce) {
  // 安全中转(Beta)：relayOnly 时强制 iceTransportPolicy=relay（仅经 TURN，不暴露直连 IP）。
  const pc = new RTCPeerConnection({
    iceServers, iceTransportPolicy: _relayOnly ? "relay" : "all",
    iceCandidatePoolSize: 2, bundlePolicy: "max-bundle",
  });
  pc.onicecandidate = (e) => { if (e.candidate) onIce(e.candidate); };
  return pc;
}

// ── viewer 可下发的会话控制（声音 / 画质 / 安全中转）。均为渲染层操作，安全降级。──
function _setAudioEnabled(on) {
  _audioOn = !!on;
  try { const at = stream && stream.getAudioTracks && stream.getAudioTracks()[0]; if (at) at.enabled = _audioOn; } catch (_e) {}
  log(_audioOn ? "已开启声音转发" : "已静音");
}
function _applyQualityPreset(q) {
  // 与本机 remote-set-quality 同源：把档位换算成发送码率/帧率上限。手动后暂停自适应 20s。
  _autoPausedUntil = Date.now() + 20000;
  try {
    const maxFr = Math.max(1, Math.min(30, (q && q.fps) || 8));
    const jpeg = (q && q.jpeg) || 70;
    const kbps = jpeg >= 85 ? 4000 : jpeg >= 65 ? 2000 : 1000;
    for (const pc of pcs.values()) {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
      if (!sender || !sender.getParameters) continue;
      const p = sender.getParameters();
      p.encodings = (p.encodings && p.encodings.length) ? p.encodings : [{}];
      p.encodings[0].maxFramerate = maxFr; p.encodings[0].maxBitrate = kbps * 1000;
      sender.setParameters(p).catch(() => {});
    }
    log("画质已切换：" + (jpeg >= 85 ? "极清" : jpeg >= 65 ? "高清" : "流畅"));
  } catch (_e) {}
}
function _setRelayOnly(on) {
  _relayOnly = !!on;
  // iceTransportPolicy 只能在创建连接时生效：对已有连接提示需重连，新连接立即按中转走。
  log(_relayOnly ? "安全中转(Beta)已开启：新连接将仅经 TURN（如未配置 TURN 将连不上）" : "安全中转已关闭");
}
async function addScreenTracks(pc) { const s = await ensureStream(); for (const t of s.getTracks()) pc.addTrack(t, s); }

// ── V103.90 自适应质量：按 RTCStats（RTT/丢包/带宽）自动升降档（对标 UU 自动降级）──
// 与手动 remote-set-quality 共存：手动设置后暂停自适应 20s，避免互相打架。
let _tierIndex = RQ ? RQ.DEFAULT_TIER : 2;
let _autoPausedUntil = 0;
const _lastTransportReportByViewer = new Map();
function _selectedTransport(entries) {
  try {
    const byId = new Map(entries.map((entry) => [entry.id, entry]));
    let pair = entries.find((entry) => entry.type === "candidate-pair" && entry.selected);
    if (!pair) {
      const transport = entries.find((entry) => entry.type === "transport" && entry.selectedCandidatePairId);
      if (transport) pair = byId.get(transport.selectedCandidatePairId);
    }
    if (!pair) pair = entries.find((entry) => entry.type === "candidate-pair" && entry.nominated && entry.state === "succeeded");
    const local = pair ? byId.get(pair.localCandidateId) : null;
    return {
      candidateType: (local && local.candidateType) || "unknown",
      protocol: (local && (local.protocol || local.relayProtocol)) || "unknown",
      rttMs: pair && Number.isFinite(pair.currentRoundTripTime) ? pair.currentRoundTripTime * 1000 : null,
      bytesSent: pair && Number.isFinite(pair.bytesSent) ? pair.bytesSent : null,
      bytesReceived: pair && Number.isFinite(pair.bytesReceived) ? pair.bytesReceived : null,
    };
  } catch (_e) { return { candidateType: "unknown", protocol: "unknown" }; }
}
function _applyTierToSenders(info) {
  for (const pc of pcs.values()) {
    try {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
      if (!sender || !sender.getParameters) continue;
      const p = sender.getParameters();
      p.encodings = (p.encodings && p.encodings.length) ? p.encodings : [{}];
      p.encodings[0].maxBitrate = info.bitrateKbps * 1000;
      p.encodings[0].maxFramerate = info.maxFps;
      if (info.scaleDown && info.scaleDown > 1) p.encodings[0].scaleResolutionDownBy = info.scaleDown;

          if (data.action === "audio") _setAudioEnabled(data.on);
          else if (data.action === "quality") _applyQualityPreset({ fps: data.fps, jpeg: data.jpeg });
          else if (data.action === "relay") _setRelayOnly(data.on);
        } catch (_e) {}
      }
    } else if (kind === "handoff") {
      // V104：手机端接力——把对话交接到本桌面端，唤起窗口 + 通知。
      // 时间窗（用户要求）：只接力 5 小时内的，超 5h 一律丢弃。实时接力（poll 阶段、已被 lastId 过滤掉历史）
      // 若确无时间戳则放行，避免误伤无 ts 的旧 App 实时交接。
      const _ts = _rowTsMs(row);
      const fresh = isNaN(_ts) ? true : (Date.now() - _ts < HANDOFF_MAX_AGE_MS);
      if (ipc && data && fresh) {
        try { ipc.send("remote-handoff", data); } catch (_e) {}
        // V203：回执——告诉手机端"本机已接管此对话"，App 接力页据此显示实时状态（已发送→已接管）。
        try {
          const convId = (data && (data.conv_id || data.convId)) || "";
          const ackPayload = { conv_id: convId, host: meHost, host_name: (typeof NAME !== "undefined" ? NAME : ""), ts: Date.now() };
          fetch(SB_URL + "/rest/v1/remote_signals", {
            method: "POST", headers: Object.assign({}, H(), { "Content-Type": "application/json", Prefer: "return=minimal" }),
            body: JSON.stringify({ room: ROOM, recipient: "relay:" + ROOM, sender: meHost, kind: "handoff_ack", payload: ackPayload }),
          }).catch(() => {});
        } catch (_e) {}
      }
    } else if (kind === "bye") {
      const pc = pcs.get(vid); if (pc) { try { pc.close(); } catch (_e) {} pcs.delete(vid); }
    }
  }
  async function primeLastId() {
    // 把 lastId 顶到当前最大 id；失败则抛错（供开机 fail-closed 重试），绝不静默归零。
    const u = SB_URL + "/rest/v1/remote_signals?room=eq." + encodeURIComponent(ROOM) +
      "&recipient=eq." + encodeURIComponent(meHost) + "&order=id.desc&limit=1&select=id";
    const r = await fetch(u, { headers: H() });
    if (!r.ok) throw new Error("prime " + r.status);
    const rows = await r.json();
    if (rows && rows[0] && rows[0].id) lastId = rows[0].id;
  }
  async function pickupRecentHandoff() {
    // 开机一次性补「最近一条接力」：只取最新 1 条 handoff，且必须有时间戳、且在 5 小时内才处理（fail-closed）。
    // 只唤起窗口（remote-handoff），绝不触发 input/connect —— 不会造成鼠标乱动 / 乱切页面 / 重建投屏。
    try {
      const u = SB_URL + "/rest/v1/remote_signals?room=eq." + encodeURIComponent(ROOM) +
        "&recipient=eq." + encodeURIComponent(meHost) + "&kind=eq.handoff&order=id.desc&limit=1";
      const r = await fetch(u, { headers: H() });
      if (!r.ok) return;
      const rows = await r.json();
      const row = rows && rows[0];
      if (!row || !row.payload || !ipc) return;
      const _ts = _rowTsMs(row);
      if (isNaN(_ts)) return;                                 // 无时间戳：不补（宁可不接力，也不误弹来历不明的旧接力）
      if (Date.now() - _ts >= HANDOFF_MAX_AGE_MS) return;     // 超 5 小时：丢弃
      try { ipc.send("remote-handoff", row.payload); log("已补接最近一条接力（5 小时内）"); } catch (_e) {}
    } catch (_e) {}
  }
  let _polling = false;
  async function poll() {
    if (_polling) return;                  // 并发闸：上一轮没跑完就跳过，避免慢查询/大结果集叠加成风暴
    _polling = true;
    try {
      const u = SB_URL + "/rest/v1/remote_signals?room=eq." + encodeURIComponent(ROOM) +
        "&recipient=eq." + encodeURIComponent(meHost) + "&id=gt." + lastId + "&order=id.asc&limit=200";
      const r = await fetch(u, { headers: H() });
      if (!r.ok) return;
      const rows = await r.json();
      if (rows.length >= 200) {
        // 熔断：单轮就来 200+ 条，几乎必是历史积压/异常 —— 把 lastId 顶到最大并丢弃这批，绝不灌给本机。
        let mx = lastId; for (const row of rows) { if (row.id > mx) mx = row.id; }
        lastId = mx; log("信令暴量(" + rows.length + ")，已跳过该批以保护本机");
        return;
      }
      for (const row of rows) { if (row.id > lastId) lastId = row.id; await onRow(row); }
    } catch (_e) {} finally { _polling = false; }
  }
  // 常驻被控：先上线注册 presence，不立刻抓屏；等查看端连接时
  //（onRow "connect" → addScreenTracks → ensureStream）再捕获。空闲不占屏幕捕获、不显示"正在共享"。
  await upsertPresence();
  setInterval(upsertPresence, 5000);
  // 关闭/退出时尽力删除自己的 presence 行（keepalive 让请求能在页面卸载后完成），设备列表即时消失。
  // 提前注册：即便后面 fail-closed 卡在等令牌刷新，也能保证退出时清理 presence。
  window.addEventListener("beforeunload", () => {
    try {
      fetch(SB_URL + "/rest/v1/remote_presence?room=eq." + encodeURIComponent(ROOM) + "&host_id=eq." + encodeURIComponent(HOST_ID),
        { method: "DELETE", headers: H(), keepalive: true });
    } catch (_e) {}
  });
  // 关键修复（卡死根因）：开机必须先把 lastId 顶到当前最大 id，首轮 poll 只收"开机之后"的新信令、绝不 replay 历史。
  // 旧实现把这一步包在 try/catch 里 fail-open：令牌过期(401)就静默失败、lastId 仍为 0，
  // 首轮 poll 便拉回整张历史表 —— 上次排队的远程操作被一股脑灌给电脑(鼠标乱动/乱切页面)、
  // 旧 connect 重建一堆 RTCPeerConnection+抓屏 → 内存冲到 ~28G、CPU 跑满、电脑卡死。
  // 改为 fail-closed：顶不到 lastId 就退避重试（TOKEN 会被主进程热刷新，H() 调用时实时读取），
  // 在 lastId 成功定位之前绝不开始 poll。
  let _primed = false;
  for (let _i = 0; _i < 900 && !_primed; _i++) {
    try { await primeLastId(); _primed = true; }
    catch (_e) {
      if (_i === 0) log("信令初始化中（等待账号令牌刷新…）");
      await new Promise((res) => setTimeout(res, Math.min(5000, 800 + _i * 400)));
    }
  }
  if (!_primed) { log("信令初始化失败，已暂停轮询以保护本机（不会 replay 历史）"); return; }
  // 开机一次性补"最近一条 5 小时内的接力"（只唤起窗口，绝不 replay 鼠标/键盘/投屏）。
  await pickupRecentHandoff();
  setInterval(poll, 800);
  log("Supabase 远程信令已就绪（常驻在线，等待查看端连接后开始投屏）…");
}

if (MODE === "supabase") log("旧版直连信令已停用，请通过 HashMM 账号后端连接");
else if (TOKEN) connect();
else log("等待主进程安全下发连接凭证…");
</script>

<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>HashMM 投屏端</title></head>
<body style="margin:0;background:#000;color:#666;font-family:sans-serif">
<div style="padding:8px;font-size:12px" id="log">HashMM 投屏渲染进程（隐藏窗口）。捕获屏幕并通过 WebRTC P2P 推送给查看端。</div>
<video id="self" autoplay muted playsinline style="display:none"></video>
<script>
"use strict";
// HashMM 投屏端（被控端的「屏幕提供者」），跑在隐藏的 Electron BrowserWindow 里。
// getDisplayMedia 屏幕捕获与 RTCPeerConnection（Chromium 硬件编码 VP8/VP9/H.264、ICE/STUN 穿透、
// DTLS-SRTP 加密）只在渲染进程可用。两种模式：
//   · 局域网(lan)：连本机 remote-server（凭 hostToken 注册），offer/answer/ICE 经本机 WS 中继。
//   · 账号(account)：连**公网账号后端**的信令中继（凭账号 token 认证为 host），同账号设备可跨网络发现并直连。
// 两模式协议一致（viewerJoined / rtcSignal{vid} / viewerLeft）。账号模式下，viewer 的输入由后端中继到
// 本页，再经 IPC 交给主进程的 cu-driver 注入（渲染进程不能直接注入系统输入）。

const qs = new URLSearchParams(location.search);
const MODE = qs.get("mode") || "lan";           // lan | account
const PORT = qs.get("port") || "17690";
let TOKEN = qs.get("token") || "";
const SIGNAL = qs.get("signal") || "";          // account 模式的后端信令 wss
const NAME = qs.get("name") || "被控端";
const logEl = document.getElementById("log");
const log = (s) => { try { logEl.textContent = s; } catch (_e) {} };

let ipc = null; try { ipc = require("electron").ipcRenderer; } catch (_e) {}
// V105 远程常驻在线：主进程会随 Supabase token 刷新把【新令牌】推过来，这里热更新 TOKEN。
// 原因：本窗启动时拿到的 access_token 约 1 小时就过期，过期后 presence 上报会 401 静默失败，
// 设备在手机端「我的设备」里 45s 后消失 —— 这就是「过一段时间远程界面里没东西」的根因。
try { if (ipc) ipc.on("remote-host-token", (_e, t) => { if (t && typeof t === "string" && t.length > 20) TOKEN = t; }); } catch (_e) {}
// V103.90 远控自适应质量/编码偏好策略（纯逻辑模块；缺失则退回静态质量，不影响连接）。
let RQ = null; try { RQ = require("./remote-quality.js"); } catch (_e) {}
// V103.90 远控控制协议（结构化+版本化+校验；缺失则退回旧 {type:"input"} 直通）。
let RP = null; try { RP = require("./remote-protocol.js"); } catch (_e) {}
// V103.90 远控扩展控制器（双向剪贴板同步等）。
let RX = null; try { RX = require("./remote-extras.js"); } catch (_e) {}
let _clip = null; try { _clip = require("electron").clipboard; } catch (_e) {}
const _clipSync = (RX && _clip) ? new RX.ClipboardSync({ minIntervalMs: 400 }) : null;

// V103.51 隐私防护：被控端把发出的视频轨替换为黑屏（停止泄露屏幕内容）。
// 真正锁本地键鼠由主进程在注入链处拒绝注入（_remotePrivacyOn）；这里只管「别人看到的画面」。
let _privacyOn = false, _blackTrack = null;
function _makeBlackTrack() {
  try {
    const c = document.createElement("canvas"); c.width = 1280; c.height = 720;
    const g = c.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "#666"; g.font = "28px sans-serif"; g.textAlign = "center";
    g.fillText("隐私模式已开启 · 屏幕已对远端隐藏", c.width / 2, c.height / 2);
    const s = c.captureStream(1);
    return s.getVideoTracks()[0] || null;
  } catch (_e) { return null; }
}
function _applyPrivacyToSenders(on) {
  _privacyOn = on;
  let real = null;
  try { real = (stream && stream.getVideoTracks && stream.getVideoTracks()[0]) || null; } catch (_e) {}
  if (on && !_blackTrack) _blackTrack = _makeBlackTrack();
  const useTrack = on ? _blackTrack : real;
  if (!useTrack) return;
  for (const pc of pcs.values()) {
    try { const sender = pc.getSenders().find(s => s.track && s.track.kind === "video"); if (sender) sender.replaceTrack(useTrack); } catch (_e) {}
  }
}
if (ipc) {
  ipc.on("remote-set-privacy", (_e, on) => { try { _applyPrivacyToSenders(!!on); log(on ? "隐私模式：屏幕已对远端隐藏" : "隐私模式已关闭"); } catch (_e2) {} });
  // V103.52 主进程 → 经信令把文件/多屏的回复发回指定 viewer
  ipc.on("remote-host-reply", (_e, payload) => {
    try { if (ws && ws.readyState === 1 && payload && payload.type) ws.send(JSON.stringify(payload)); } catch (_e2) {}
  });
  ipc.on("remote-set-quality", (_e, q) => {
    // 调整发送编码码率/帧率上限（真彩=高码率）。失败静默，不影响连接。
    // V103.90：手动设置后暂停自适应 20s，避免自动档位立刻把手动值覆盖掉。
    _autoPausedUntil = Date.now() + 20000;
    try {
      const maxFr = Math.max(1, Math.min(30, (q && q.fps) || 8));
      const kbps = (q && q.jpeg >= 85) ? 4000 : (q && q.jpeg >= 65) ? 2000 : 1000;
      for (const pc of pcs.values()) {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
        if (!sender || !sender.getParameters) continue;
        const p = sender.getParameters(); p.encodings = p.encodings && p.encodings.length ? p.encodings : [{}];
        p.encodings[0].maxFramerate = maxFr; p.encodings[0].maxBitrate = kbps * 1000;
        sender.setParameters(p).catch(() => {});
      }
    } catch (_e2) {}
  });
}

let stream = null, iceServers = [{ urls: "stun:stun.l.google.com:19302" }, { urls: ["turn:openrelay.metered.ca:80", "turn:openrelay.metered.ca:443", "turns:openrelay.metered.ca:443?transport=tcp"], username: "openrelayproject", credential: "openrelayproject" }];
let _audioOn = false;       // 远端是否听本机声音（默认关，按需由 viewer 控制开启）
let _relayOnly = false;     // 安全中转(Beta)：强制经 TURN 中转，不暴露 P2P 直连 IP
const pcs = new Map();              // vid -> RTCPeerConnection
let manualPC = null;
let ws = null;

async function ensureStream() {
  if (stream) return stream;
  const video = { frameRate: { ideal: 30, max: 60 }, width: { ideal: 1920 }, height: { ideal: 1080 } };
  // 优先连系统声音一起采集；不支持/被拒就回退到无声（绝不因声音失败而丢画面）。
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video, audio: true });
  } catch (_e1) {
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video, audio: false });
    } catch (_e2) {
      hlog("getDisplayMedia 失败（抓不到屏 → 黑屏）：" + ((_e2 && _e2.message) || _e2));
      throw _e2;
    }
  }
  try {
    const vt = stream.getVideoTracks()[0];
    const st = (vt && vt.getSettings) ? vt.getSettings() : {};
    hlog("抓屏成功 " + (st.width || "?") + "x" + (st.height || "?") +
         " 视频轨=" + stream.getVideoTracks().length + " 音频轨=" + stream.getAudioTracks().length +
         " 视频轨状态=" + (vt ? vt.readyState : "无"));
  } catch (_e) {}
  // 音频轨默认按当前开关状态（默认静音）；开关切换只改 track.enabled，无需重协商。
  try { const at = stream.getAudioTracks()[0]; if (at) at.enabled = _audioOn; } catch (_e) {}
  document.getElementById("self").srcObject = stream;
  startRelayPush();   // 同时把画面以低帧率推到后端中继，供 P2P/TURN 打不通的查看端 HTTP 兜底拉取
  return stream;
}
// 被控端诊断：把抓屏/推流状态 POST 到后端日志（黑屏排障用，用户分享后端日志即可看到）。
function hlog(msg) {
  try {
    console.log("[host-diag]", msg);
    const base = _relayHttpBase(); const uid = _relayUid();
    if (!base) return;
    fetch(base + "/api/remote/relay/hostlog", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
      body: JSON.stringify({ msg: String(msg), room: uid }),
      keepalive: true,
    }).catch(() => {});
  } catch (_e) {}
}
// ── 帧中继兜底（仅账号模式）：把屏幕以低帧率 JPEG 推到后端，供 P2P/TURN 打不通的查看端 GET 拉取。
// 不依赖 WebRTC 是否连通；信令与输入仍走原通道，只有「画面」多了这条 HTTP 兜底路。room=账号 uid。
let _relayPushTimer = null;
function _relayUid() {
  try { return (JSON.parse(atob((TOKEN.split(".")[1]) || "")) || {}).sub || ""; } catch (_e) { return ""; }
}
function _relayHttpBase() {
  // 账号模式优先用主进程传入的后端地址（与查看端 App 同一后端）；否则从 SIGNAL(WS) 派生。
  try { const ab = qs.get("apiBase"); if (ab) return ab.replace(/\/+$/, ""); } catch (_e) {}
  if (!SIGNAL) return "";
  try { return SIGNAL.replace(/^ws/, "http").replace(/\/api\/remote\/ws.*$/, ""); } catch (_e) { return ""; }
}
function startRelayPush() {
  if (_relayPushTimer) return;                 // 不再卡 MODE：只要能推就推（有信令URL+uid 即账号场景）
  const base = _relayHttpBase(); const uid = _relayUid();
  if (!base || !uid) { console.warn("[relay] 无法推帧：base/uid 为空", { base, uid, SIGNAL, MODE }); return; }
  console.log("[relay] 开始推帧到", base, "room=", uid);
  const cvs = document.createElement("canvas");
  const ctx = cvs.getContext("2d");
  const vid = document.getElementById("self");
  let busy = false;
  let _diagPushed = false;
  let _diagFailLogged = false;
  let _delay = 2500;            // 没人看时只 ~0.4fps 探测一帧，避免日志/上行刷屏；有人看立刻提到 ~4fps
  const pump = async () => {
    // P2P(WebRTC)直连在用 → 查看端走直连拿画面，中继完全不需要，直接一帧都不推（后端日志彻底不刷屏）。
    let p2pLive = false;
    try { pcs.forEach((pc) => { if (pc && pc.connectionState === "connected") p2pLive = true; }); } catch (_e) {}
    if (!p2pLive && !busy && stream && !_privacyOn) {  // 隐私黑屏时不推真实画面
      const w = vid.videoWidth || 0, h = vid.videoHeight || 0;
      if (w && h) {
        busy = true;
        try {
          const scale = Math.min(1, 1280 / Math.max(w, h));  // 长边 ~1280，控制单帧体积与上行
          cvs.width = Math.round(w * scale); cvs.height = Math.round(h * scale);
          ctx.drawImage(vid, 0, 0, cvs.width, cvs.height);
          const blob = await new Promise((res) => cvs.toBlob(res, "image/jpeg", 0.6));
          if (blob) {
            const r = await fetch(base + "/api/remote/relay/" + encodeURIComponent(uid) + "/push", {
              method: "POST",
              headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "image/jpeg" },
              body: blob,
            });
            if (r && r.ok) {
              // 后端回报「现在有没有人在看」：有人看→250ms(~4fps)；没人看→2.5s 探测一帧（日志不再刷屏）。
              let watching = false;
              try { watching = !!(await r.json()).watching; } catch (_e) {}
              _delay = watching ? 250 : 2500;
              if (!_diagPushed) { _diagPushed = true; hlog("中继首帧已推送 " + cvs.width + "x" + cvs.height + "（画面在流）"); }
            } else if (!_diagFailLogged && r) { _diagFailLogged = true; hlog("中继推帧 HTTP " + r.status + "（查看端将拉不到画面）"); }
          }
        } catch (_e) {
          if (!_diagFailLogged) { _diagFailLogged = true; hlog("中继推帧异常：" + ((_e && _e.message) || _e)); }
        }
        busy = false;
      }
    }
    // P2P 在用时只本地复查（不发任何请求），3 秒一次；P2P 断了立刻回到正常中继节奏。
    _relayPushTimer = setTimeout(pump, p2pLive ? 3000 : _delay);
  };
  _relayPushTimer = setTimeout(pump, 0);
}

function makePC(onIce) {
  // 安全中转(Beta)：relayOnly 时强制 iceTransportPolicy=relay（仅经 TURN，不暴露直连 IP）。
  const pc = new RTCPeerConnection({ iceServers, iceTransportPolicy: _relayOnly ? "relay" : "all" });
  pc.onicecandidate = (e) => { if (e.candidate) onIce(e.candidate); };
  return pc;
}

// ── viewer 可下发的会话控制（声音 / 画质 / 安全中转）。均为渲染层操作，安全降级。──
function _setAudioEnabled(on) {
  _audioOn = !!on;
  try { const at = stream && stream.getAudioTracks && stream.getAudioTracks()[0]; if (at) at.enabled = _audioOn; } catch (_e) {}
  log(_audioOn ? "已开启声音转发" : "已静音");
}
function _applyQualityPreset(q) {
  // 与本机 remote-set-quality 同源：把档位换算成发送码率/帧率上限。手动后暂停自适应 20s。
  _autoPausedUntil = Date.now() + 20000;
  try {
    const maxFr = Math.max(1, Math.min(30, (q && q.fps) || 8));
    const jpeg = (q && q.jpeg) || 70;
    const kbps = jpeg >= 85 ? 4000 : jpeg >= 65 ? 2000 : 1000;
    for (const pc of pcs.values()) {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
      if (!sender || !sender.getParameters) continue;
      const p = sender.getParameters();
      p.encodings = (p.encodings && p.encodings.length) ? p.encodings : [{}];
      p.encodings[0].maxFramerate = maxFr; p.encodings[0].maxBitrate = kbps * 1000;
      sender.setParameters(p).catch(() => {});
    }
    log("画质已切换：" + (jpeg >= 85 ? "极清" : jpeg >= 65 ? "高清" : "流畅"));
  } catch (_e) {}
}
function _setRelayOnly(on) {
  _relayOnly = !!on;
  // iceTransportPolicy 只能在创建连接时生效：对已有连接提示需重连，新连接立即按中转走。
  log(_relayOnly ? "安全中转(Beta)已开启：新连接将仅经 TURN（如未配置 TURN 将连不上）" : "安全中转已关闭");
}
async function addScreenTracks(pc) { const s = await ensureStream(); for (const t of s.getTracks()) pc.addTrack(t, s); }

// ── V103.90 自适应质量：按 RTCStats（RTT/丢包/带宽）自动升降档（对标 UU 自动降级）──
// 与手动 remote-set-quality 共存：手动设置后暂停自适应 20s，避免互相打架。
let _tierIndex = RQ ? RQ.DEFAULT_TIER : 2;
let _autoPausedUntil = 0;
function _applyTierToSenders(info) {
  for (const pc of pcs.values()) {
    try {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
      if (!sender || !sender.getParameters) continue;
      const p = sender.getParameters();
      p.encodings = (p.encodings && p.encodings.length) ? p.encodings : [{}];
      p.encodings[0].maxBitrate = info.bitrateKbps * 1000;
      p.encodings[0].maxFramerate = info.maxFps;
      if (info.scaleDown && info.scaleDown > 1) p.encodings[0].scaleResolutionDownBy = info.scaleDown;
      else delete p.encodings[0].scaleResolutionDownBy;
      sender.setParameters(p).catch(() => {});
    } catch (_e) {}
  }
}
async function _adaptOnce() {
  if (!RQ || _privacyOn || pcs.size === 0) return;
  if (Date.now() < _autoPausedUntil) return;
  try {
    // 取第一个活跃连接的统计作代表（单被控多观看场景下足够指导编码档位）
    const pc = pcs.values().next().value;
    if (!pc || !pc.getStats) return;
    const report = await pc.getStats();
    const entries = []; report.forEach(s => entries.push(s));
    const stats = RQ.extractStats(entries);
    const decision = RQ.adaptQuality(stats, _tierIndex);
    if (decision.changed) {
      _tierIndex = decision.tierIndex;
      _applyTierToSenders(decision);
      try { log(`自适应质量：${decision.direction === "down" ? "↓" : "↑"} ${decision.name}（${decision.reason}）`); } catch (_e) {}
      if (ipc) { try { ipc.send("remote-quality-adapted", { tier: decision.name, index: _tierIndex, reason: decision.reason }); } catch (_e) {} }
    }
  } catch (_e) { /* 单次自适应失败忽略 */ }
}
setInterval(_adaptOnce, 3000);

// V103.90 双向剪贴板：轮询本机剪贴板，有新内容（非来自对端的回环）就发给 viewer 端。
// Electron 无剪贴板变更事件，轮询是常规做法；_clipSync 负责防回环/去重/防抖。
function _clipPollOnce() {
  if (!_clipSync || !_clip || !ws || ws.readyState !== 1 || _privacyOn) return;
  try {
    const txt = _clip.readText();
    const r = _clipSync.onLocalChange(txt);
    if (r.send) ws.send(JSON.stringify({ type: "clip", text: r.payload.text, hash: r.payload.hash }));
  } catch (_e) { /* 单次轮询失败忽略 */ }
}
setInterval(_clipPollOnce, 1000);

// ── 信令连接（两模式共用消息处理）─────────────────────────────
function wsAddress() { return MODE === "account" ? SIGNAL : ("ws://127.0.0.1:" + PORT + "/"); }
function connect() {
  const url = wsAddress();
  if (!url) { log("缺少信令地址"); return; }
  ws = new WebSocket(url);
  ws.onopen = () => {
    if (MODE === "account") { ws.send(JSON.stringify({ type: "auth", token: TOKEN, role: "host", name: NAME, platform: (navigator.platform || "") })); log("连接账号信令，注册被控端…"); }
    else { ws.send(JSON.stringify({ type: "hostRegister", token: TOKEN })); log("连接本机信令，注册投屏端…"); }
  };
  ws.onclose = () => { log("信令断开，3s 后重连"); setTimeout(connect, 3000); };
  ws.onerror = () => {};
  ws.onmessage = async (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (_e) { return; }
    if (m.type === "hostReady" || m.type === "authOk") { if (Array.isArray(m.iceServers) && m.iceServers.length) iceServers = m.iceServers; log("被控端就绪，等待查看端…"); try { await ensureStream(); } catch (e) { log("屏幕捕获失败：" + ((e && e.message) || e)); } return; }
    if (m.type === "hostRejected" || m.type === "authFail") { log("注册被拒（凭证不符）"); return; }
    if (m.type === "viewerJoined") { await onViewerJoined(m.vid); return; }
    if (m.type === "viewerLeft") { const pc = pcs.get(m.vid); if (pc) { try { pc.close(); } catch (_e) {} pcs.delete(m.vid); } return; }
    if (m.type === "rtcSignal") { await onViewerSignal(m.vid, m.kind, m.data); return; }
    // 账号模式：viewer 的输入经后端中继到这里 → 交主进程注入
    // V103.90：输入消息经控制协议解码（兼容旧 {type:"input"} 与新 v1 信封），转发归一后的输入数据。
    if (RP) {
      const _dr = RP.decode(m);
      if (_dr.ok && _dr.t === RP.T.INPUT) { if (ipc) { try { ipc.send("remote-host-input", _dr.d); } catch (_e) {} } return; }
    }
    if (m.type === "input") { if (ipc) { try { ipc.send("remote-host-input", m); } catch (_e) {} } return; }
    // V108 会话控制：viewer 下发 声音 / 画质 / 安全中转，渲染层直接处理。
    if (m.type === "control") {
      try {
        if (m.action === "audio") _setAudioEnabled(m.on);
        else if (m.action === "quality") _applyQualityPreset({ fps: m.fps, jpeg: m.jpeg });
        else if (m.action === "relay") _setRelayOnly(m.on);
      } catch (_e) {}
      return;
    }
    // V103.52 会话内扩展：文件传输 + 多屏。交给主进程做磁盘/显示器，回复经信令发回该 viewer。
    if (m.type === "fileOffer" || m.type === "fileChunk" || m.type === "fileDone" || m.type === "fileCancel" || m.type === "fileResumeQuery") {
      if (ipc) { try { ipc.send("remote-host-file", m); } catch (_e) {} }
      return;
    }
    if (m.type === "selectMonitor") {
      if (m.query) { if (ipc) { try { ipc.send("remote-host-monitors-query", { vid: m.vid }); } catch (_e) {} } }
      else if (ipc) { try { ipc.send("remote-host-select-monitor", m); } catch (_e) {} }
      return;
    }
    // V103.90 双向剪贴板：viewer 端剪贴板 → 写入本机剪贴板（_clipSync 防回环，登记后下次本地轮询不回传）。
    if (m.type === "clip" && _clipSync && _clip) {
      try {
        const r = _clipSync.onRemoteData({ text: m.text, hash: m.hash });
        if (r.apply) { _clip.writeText(r.text); log("已同步对端剪贴板到本机"); }
      } catch (_e) {}
      return;
    }
  };
}
async function onViewerJoined(vid) {
  try {
    if (pcs.has(vid)) { try { pcs.get(vid).close(); } catch (_e) {} }
    const pc = makePC((cand) => ws.send(JSON.stringify({ type: "rtcSignal", vid, kind: "ice", data: cand })));
    pcs.set(vid, pc);
    await addScreenTracks(pc);
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: "rtcSignal", vid, kind: "offer", data: pc.localDescription }));
    log("已向查看端 #" + vid + " 发送 offer");
  } catch (e) { log("建立到 #" + vid + " 失败：" + ((e && e.message) || e)); }
}
async function onViewerSignal(vid, kind, data) {
  const pc = pcs.get(vid); if (!pc) return;
  try { if (kind === "answer") await pc.setRemoteDescription(data); else if (kind === "ice") { try { await pc.addIceCandidate(data); } catch (_e) {} } } catch (_e) {}
}

// ── 跨网络手动信令（经 IPC 与可见「远程」页交换）─────────────
function waitIceComplete(pc) { return new Promise((res) => { if (pc.iceGatheringState === "complete") return res(); const t = setTimeout(res, 4000); pc.addEventListener("icegatheringstatechange", () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); } }); }); }
if (ipc) {
  ipc.on("manual-create", async () => {
    try {
      if (manualPC) { try { manualPC.close(); } catch (_e) {} }
      manualPC = makePC(() => {});
      await addScreenTracks(manualPC);
      const offer = await manualPC.createOffer(); await manualPC.setLocalDescription(offer);
      await waitIceComplete(manualPC);
      ipc.send("manual-offer", { ok: true, sdp: btoa(unescape(encodeURIComponent(JSON.stringify(manualPC.localDescription)))) });
      log("已生成跨网络邀请码（含 ICE 候选）");
    } catch (e) { ipc.send("manual-offer", { ok: false, error: (e && e.message) || String(e) }); }
  });
  ipc.on("manual-answer", async (_e, code) => {
    try { if (!manualPC) return; const ans = JSON.parse(decodeURIComponent(escape(atob(String(code).trim())))); await manualPC.setRemoteDescription(ans); ipc.send("manual-applied", { ok: true }); log("跨网络应答已应用，P2P 协商中…"); }
    catch (e) { ipc.send("manual-applied", { ok: false, error: (e && e.message) || String(e) }); }
  });
}

// ── Supabase 信令模式（P2P，无需后端/隧道）─────────────────
// 同账号 + 联网即可：被控端凭账号令牌(=Supabase access token)向 remote_presence 上报在线，
// 轮询 remote_signals 取 viewer 的 connect/answer/ice/input，offer/ice 写回。屏幕走 P2P。
const SB_FALLBACK_URL = "";
const SB_FALLBACK_KEY = "";
function _jwtSub(tok) {
  try {
    const b = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return (JSON.parse(decodeURIComponent(escape(atob(b)))).sub) || "";
  } catch (_e) { return ""; }
}
async function connectSupabase() {
  const SB_URL = qs.get("sbUrl") || SB_FALLBACK_URL;
  const SB_KEY = qs.get("sbKey") || SB_FALLBACK_KEY;
  const ROOM = _jwtSub(TOKEN);
  if (!ROOM) { log("账号令牌无效，无法启动 Supabase 远程信令"); return; }
  // 稳定 host_id：持久化到 localStorage，重启/多次启动复用同一条 presence 行（避免设备列表里同一台机器出现多条）。
  let HOST_ID;
  try {
    HOST_ID = localStorage.getItem("hmm_host_id");
    if (!HOST_ID) { HOST_ID = "h-" + Math.random().toString(36).slice(2, 10); localStorage.setItem("hmm_host_id", HOST_ID); }
  } catch (_e) { HOST_ID = "h-" + Math.random().toString(36).slice(2, 10); }
  const meHost = "host:" + HOST_ID;
  iceServers = [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }, { urls: ["turn:openrelay.metered.ca:80", "turn:openrelay.metered.ca:443", "turns:openrelay.metered.ca:443?transport=tcp"], username: "openrelayproject", credential: "openrelayproject" }];
  const H = (extra) => Object.assign({ apikey: SB_KEY, Authorization: "Bearer " + TOKEN, "Content-Type": "application/json" }, extra || {});
  let lastId = 0;

  let _presenceWarned = false;
  async function upsertPresence() {
    try {
      const r = await fetch(SB_URL + "/rest/v1/remote_presence", {
        method: "POST", headers: H({ Prefer: "resolution=merge-duplicates" }),
        body: JSON.stringify({ room: ROOM, host_id: HOST_ID, name: NAME, platform: navigator.platform || "", updated_at: new Date().toISOString() }),
      });
      if (r && !r.ok) {
        if (!_presenceWarned) { _presenceWarned = true; log("在线上报失败 " + r.status + (r.status === 401 ? "（令牌过期，等待主进程刷新…）" : "")); }
      } else { _presenceWarned = false; }
    } catch (_e) {}
  }
  async function sendSignal(recipient, kind, payload) {
    try {
      await fetch(SB_URL + "/rest/v1/remote_signals", {
        method: "POST", headers: H(),
        body: JSON.stringify({ room: ROOM, recipient: recipient, sender: meHost, kind: kind, payload: payload || null }),
      });
    } catch (_e) {}
  }
  async function onRow(row) {
    const vid = row.sender, kind = row.kind, data = row.payload;
    if (!vid || !kind) return;
    if (kind === "connect") {
      try {
        if (pcs.has(vid)) { try { pcs.get(vid).close(); } catch (_e) {} }
        const pc = makePC((cand) => sendSignal(vid, "ice", cand));
        pcs.set(vid, pc);
        await addScreenTracks(pc);
        const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
        await sendSignal(vid, "offer", pc.localDescription);
        log("已向查看端发送 offer");
      } catch (e) { log("建连失败：" + ((e && e.message) || e)); }
    } else if (kind === "answer") {
      const pc = pcs.get(vid); if (pc && data) { try { await pc.setRemoteDescription(data); } catch (_e) {} }
    } else if (kind === "ice") {
      const pc = pcs.get(vid); if (pc && data) { try { await pc.addIceCandidate(data); } catch (_e) {} }
    } else if (kind === "input") {
      if (ipc && data) { try { ipc.send("remote-host-input", data); } catch (_e) {} }
    } else if (kind === "control") {
      // V108 会话控制：手机端下发 声音 / 画质 / 安全中转，渲染层直接处理。
      if (data) {
        try {
          if (data.action === "audio") _setAudioEnabled(data.on);
          else if (data.action === "quality") _applyQualityPreset({ fps: data.fps, jpeg: data.jpeg });
          else if (data.action === "relay") _setRelayOnly(data.on);
        } catch (_e) {}
      }
    } else if (kind === "handoff") {
      // V104：手机端接力——把对话交接到本桌面端，唤起窗口 + 通知。
      // 双保险：除了 lastId 不 replay 历史，再按时间戳过滤——只处理近 3 分钟内的接力（旧 App 无 ts 则放行）。
      const fresh = !data || !data.ts || (Date.now() - Number(data.ts) < 3 * 60 * 1000);
      if (ipc && data && fresh) { try { ipc.send("remote-handoff", data); } catch (_e) {} }
    } else if (kind === "bye") {
      const pc = pcs.get(vid); if (pc) { try { pc.close(); } catch (_e) {} pcs.delete(vid); }
    }
  }
  async function poll() {
    try {
      const u = SB_URL + "/rest/v1/remote_signals?room=eq." + encodeURIComponent(ROOM) +
        "&recipient=eq." + encodeURIComponent(meHost) + "&id=gt." + lastId + "&order=id.asc";
      const r = await fetch(u, { headers: H() });
      if (!r.ok) return;
      const rows = await r.json();
      for (const row of rows) { if (row.id > lastId) lastId = row.id; await onRow(row); }
    } catch (_e) {}
  }
  // 常驻被控：先上线注册 presence，不立刻抓屏；等查看端连接时
  //（onRow "connect" → addScreenTracks → ensureStream）再捕获。空闲不占屏幕捕获、不显示"正在共享"。
  await upsertPresence();
  setInterval(upsertPresence, 5000);
  // 关键：开机先把 lastId 顶到当前最大 id —— 首轮只收"开机之后"的新信令，绝不 replay 历史。
  // 否则一打开客户端就：① 旧"已接力"通知反复弹；② 上次排队的远程操作被一股脑灌给电脑（乱动）。
  try {
    const _pu = SB_URL + "/rest/v1/remote_signals?room=eq." + encodeURIComponent(ROOM) +
      "&recipient=eq." + encodeURIComponent(meHost) + "&order=id.desc&limit=1&select=id";
    const _pr = await fetch(_pu, { headers: H() });
    if (_pr.ok) { const _rows = await _pr.json(); if (_rows && _rows[0] && _rows[0].id) lastId = _rows[0].id; }
  } catch (_e) {}
  setInterval(poll, 800);
  // 关闭/退出时尽力删除自己的 presence 行（keepalive 让请求能在页面卸载后完成），设备列表即时消失。
  window.addEventListener("beforeunload", () => {
    try {
      fetch(SB_URL + "/rest/v1/remote_presence?room=eq." + encodeURIComponent(ROOM) + "&host_id=eq." + encodeURIComponent(HOST_ID),
        { method: "DELETE", headers: H(), keepalive: true });
    } catch (_e) {}
  });
  log("Supabase 远程信令已就绪（常驻在线，等待查看端连接后开始投屏）…");
}

if (MODE === "supabase") connectSupabase(); else connect();
</script>

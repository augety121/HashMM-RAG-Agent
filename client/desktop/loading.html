<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Inter', -apple-system, sans-serif;
    background: radial-gradient(140% 120% at 50% -10%, #FAF6EF 0%, #F5F0E8 55%, #EFE8DB 100%);
    color: #191919; }
  .logo { width: 72px; height: 72px;
    background: url("./assets/brand/hashmm-app-tile.svg") center/contain no-repeat;
    filter: drop-shadow(0 8px 22px rgba(24,25,28,.14)); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .85; } }
  .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; margin-top: 22px; }
  .sub { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; color: #A85A40; margin-top: 8px; }
  .bar { width: 180px; height: 3px; background: #E2D9C8; border-radius: 2px; margin-top: 28px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 2px;
    background: linear-gradient(90deg, #CC785C, #D97757);
    animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .tip { font-size: 12px; color: #8C8474; margin-top: 18px; }
</style></head>
<body>
  <div class="logo" role="img" aria-label="HashMM Observer"></div>
  <div class="name">HashMM</div>
  <div class="sub">Connecting Backend</div>
  <div class="bar"><i></i></div>
  <div class="tip" id="tip">正在加载工作台…</div>
</body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HashMM — 终端驾驶舱</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark;
    --paper-3: #EFE8DB; --ink: #191919; --ink-2: #5C564C; --ink-3: #8C8474;
    --terra: #CC785C; --terra-2: #D97757; --line: #E2D9C8; --green: #7A8B5E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0c0a;
    font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100vh; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 9px 13px;
    background: #EFE8DB; border-bottom: 1px solid var(--line); flex-shrink: 0; color: var(--ink); }
  .bar .title { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 600; margin-right: 8px; }
  .agent-state { font-family: 'Geist Mono', monospace; font-size: 10.5px; color: var(--ink-3); margin-right: auto; }
  .agent-state.running { color: var(--green); }
  .fs-flash { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--terra); margin-right: 10px; opacity: 0; transition: opacity .3s; }
  .fs-flash.show { opacity: 1; }
  button { border: 1px solid var(--line); background: #FBF8F2; color: var(--ink-2);
    padding: 6px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer; font-family: 'Inter', sans-serif; }
  button:hover { border-color: var(--terra); color: var(--ink); }
  button.accent { background: var(--terra); border-color: var(--terra); color: #fff; font-weight: 600; }
  button.accent:hover { background: var(--terra-2); }
  button:disabled { opacity: .5; cursor: default; }
  .term-host { flex: 1; min-height: 0; padding: 8px 10px; background: #0b0c0a; }
  #term { width: 100%; height: 100%; }
  .unavailable { display: flex; align-items: center; justify-content: center; height: 100%;
    color: #8b93a7; font-size: 13px; text-align: center; line-height: 1.8; padding: 0 40px; }
  code { background: #1a1a18; padding: 1px 6px; border-radius: 4px; color: #cdf24b; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <span class="title">终端驾驶舱</span>
      <span class="agent-state" id="agentState">裸 shell</span>
      <span class="fs-flash" id="fsFlash"></span>
      <button class="accent" id="btnClaude">Claude Code</button>
      <button class="accent" id="btnCodex">Codex</button>
      <button id="btnClear">清屏</button>
      <button id="btnRestart">重启会话</button>
    </div>
    <div class="term-host" id="host">
      <div id="term"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script>
    const T = window.hashmmTerm;
    const host = document.getElementById("host");

    if (!T || !T.available) {
      host.innerHTML = '<div class="unavailable">内嵌终端不可用（node-pty 未编译）。<br>' +
        '在 <code>desktop/</code> 目录运行 <code>npm run rebuild</code> 后重开。<br>' +
        '终端用于直接指挥 Claude Code / Codex 等命令行 coding agent。</div>';
    } else {
      const term = new Terminal({
        fontSize: 13, fontFamily: 'Menlo, Consolas, "Cascadia Code", monospace',
        theme: { background: "#0b0c0a", foreground: "#d6dac9", cursor: "#cdf24b", cursorAccent: "#0b0c0a" },
        cursorBlink: true, scrollback: 5000,
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById("term"));
      fit.fit();

      const id = "main";
      let alive = false;

      async function start() {
        const r = await T.spawn({ id, cwd: null, cols: term.cols, rows: term.rows });
        if (!r || !r.ok) { term.writeln("\x1b[31m启动失败: " + ((r && r.error) || "未知") + "\x1b[0m"); return; }
        alive = true;
        term.writeln("\x1b[90m已连接 " + (r.shell || "shell") + " · cwd " + (r.cwd || "") + "\x1b[0m");
        term.writeln("\x1b[90m点上方按钮可直接拉起 Claude Code / Codex。\x1b[0m");
      }

      T.onData((m) => { if (m.id === id) term.write(m.data); });
      T.onExit((m) => { if (m.id === id) { alive = false; term.writeln("\r\n\x1b[33m[会话结束]\x1b[0m"); } });
      term.onData((d) => { if (alive) T.input(id, d); });
      term.onResize(({ cols, rows }) => { if (alive) T.resize(id, cols, rows); });

      const ro = new ResizeObserver(() => { try { fit.fit(); } catch (_) {} });
      ro.observe(host);

      // 进程状态轮询：识别正在跑 claude / codex
      const stateEl = document.getElementById("agentState");
      setInterval(async () => {
        if (!alive) { stateEl.textContent = "未连接"; stateEl.className = "agent-state"; return; }
        try {
          const r = await T.proc(id);
          const proc = (r && r.proc || "").toLowerCase();
          if (proc.includes("claude")) { stateEl.textContent = "● Claude Code 运行中"; stateEl.className = "agent-state running"; }
          else if (proc.includes("codex")) { stateEl.textContent = "● Codex 运行中"; stateEl.className = "agent-state running"; }
          else { stateEl.textContent = "裸 shell（" + (proc || "shell") + "）"; stateEl.className = "agent-state"; }
        } catch (_) {}
      }, 1500);

      document.getElementById("btnClaude").addEventListener("click", () => { T.runAgent(id, "claude"); term.focus(); });
      document.getElementById("btnCodex").addEventListener("click", () => { T.runAgent(id, "codex"); term.focus(); });
      document.getElementById("btnClear").addEventListener("click", () => { term.clear(); term.focus(); });
      document.getElementById("btnRestart").addEventListener("click", async () => {
        T.kill(id); term.clear(); await new Promise(r => setTimeout(r, 200)); start();
      });

      // 文件变更感知（适配自 fanbox）：agent 在工作目录改文件 → 顶部闪一下提示
      const fsFlash = document.getElementById("fsFlash");
      let flashTimer = null;
      if (T.onFsChanged) {
        T.onFsChanged((m) => {
          fsFlash.textContent = "⟳ 文件已变更" + (m.filename ? "：" + m.filename : "");
          fsFlash.classList.add("show");
          clearTimeout(flashTimer);
          flashTimer = setTimeout(() => fsFlash.classList.remove("show"), 2500);
        });
      }

      start();
    }
  </script>
</body>
</html>

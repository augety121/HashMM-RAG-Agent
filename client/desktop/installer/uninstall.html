  .desc{margin-top:14px;font-size:13px;color:#8a8a98;line-height:1.95;text-align:center;}
  .desc b{color:#5d4eec;font-weight:500;}
  .btnrow{margin:26px auto 0;display:flex;gap:12px;width:100%;max-width:330px;}
  .btn{flex:1;height:46px;border:none;border-radius:23px;font-size:15px;font-weight:500;cursor:pointer;transition:all .12s;}
  .btn-ghost{background:#f3f3f7;color:#6a6a78;}
  .btn-ghost:hover{background:#ebebf1;}
  .btn-primary{color:#fff;background:linear-gradient(135deg,#7e6ff6,#5d4eec);box-shadow:0 10px 22px rgba(93,78,236,0.30);letter-spacing:2px;}
  .btn-primary:hover{filter:brightness(1.06);box-shadow:0 13px 26px rgba(93,78,236,0.38);}
  .btn-primary:active{transform:translateY(1px);}
  .barwrap{margin-top:30px;height:8px;border-radius:5px;background:#eeeef4;overflow:hidden;}
  .bar{height:100%;width:0%;border-radius:5px;transition:width .3s ease;background:linear-gradient(90deg,#7e6ff6,#5d4eec);}
  .done-icon{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:40px;background:linear-gradient(150deg,#9aa0ad,#6b7280);box-shadow:0 12px 26px rgba(107,114,128,0.26);}
  .hidden{display:none;}

<body>
<div class="card">
  <div class="titlebar">
    <div class="winbtn" id="min" title="最小化">&#8211;</div>
    <div class="winbtn close" id="close" title="关闭">&#10005;</div>
  </div>

  <div class="view" id="view-confirm">
    <div class="col">
      <div class="logo"></div>
      <div class="name">卸载 HashMM</div>
      <div class="desc">即将从这台电脑移除 HashMM。<br>你的文件与 ProjectVault 默认保留在安装目录的 <b>HashMM Files</b> 和 <b>HashMM Data</b>，重装即恢复。</div>
    </div>
    <div class="btnrow">
      <button class="btn btn-ghost" id="cancel">取消</button>
      <button class="btn btn-primary" id="uninstall">卸载</button>
    </div>
  </div>

  <div class="view hidden" id="view-progress">
    <div class="col" style="margin-top:22px;">
      <div class="logo" style="width:68px;height:68px;border-radius:17px;"></div>
      <div class="name" style="font-size:17px;margin-top:18px;">正在卸载 HashMM…</div>
      <div class="desc" style="margin-top:8px;">正在移除程序文件</div>
    </div>
    <div class="barwrap"><div class="bar" id="bar"></div></div>
    <div style="margin-top:auto;"></div>
  </div>

  <div class="view hidden" id="view-done">
    <div class="col" style="margin-top:20px;">
      <div class="done-icon">&#10003;</div>
      <div class="name" style="font-size:19px;margin-top:18px;">已卸载 HashMM</div>
      <div class="desc">程序已移除。你的文件与 ProjectVault 仍保留在 HashMM Files 和 HashMM Data，<br>重新安装即可原样恢复。</div>
    </div>
    <div class="btnrow" style="max-width:200px;">
      <button class="btn btn-primary" id="finish" style="letter-spacing:3px;">完成</button>
    </div>
  </div>
</div>
<script>
(function(){
  var API=window.hashmmUninstaller||null;
  document.getElementById("min").onclick=function(){ API&&API.minimize(); };
  document.getElementById("close").onclick=function(){ API&&API.close(); };
  document.getElementById("cancel").onclick=function(){ API&&API.close(); };

  function fakeBar(then){ var p=0,b=document.getElementById("bar"); var t=setInterval(function(){p+=20;b.style.width=Math.min(100,p)+"%";if(p>=100){clearInterval(t);then&&then();}},260); }

  document.getElementById("uninstall").onclick=function(){
    document.getElementById("view-confirm").classList.add("hidden");
    document.getElementById("view-progress").classList.remove("hidden");
    if(!API){ fakeBar(showDone); return; }
    // 进度条走动画的同时触发真实卸载（自删脚本会在本进程退出后删目录）
    fakeBar(null);
    API.run().then(function(r){
      var b=document.getElementById("bar"); b.style.width="100%";
      if(r&&r.ok){ setTimeout(showDone,500); }
      else { document.getElementById("view-progress").classList.add("hidden"); document.getElementById("view-confirm").classList.remove("hidden"); alert("卸载失败："+((r&&r.error)||"未知错误")); }
    });
  };
  function showDone(){ document.getElementById("view-progress").classList.add("hidden"); document.getElementById("view-done").classList.remove("hidden"); }
  document.getElementById("finish").onclick=function(){ API&&API.done(); };
})();
</script>
</body>

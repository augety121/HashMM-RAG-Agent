<html lang="zh-CN">

<title>HashMM 安装</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:transparent;}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#1a1a24;user-select:none;
    overflow:hidden;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;}
  .card{width:472px;height:476px;background:#fff;border-radius:18px;position:relative;overflow:hidden;
    box-shadow:0 22px 60px rgba(38,28,86,0.20),0 3px 10px rgba(38,28,86,0.08);
    display:flex;flex-direction:column;}
  /* 顶部极淡的品牌光晕，给纯白一点呼吸感（微信式克制） */

    width:360px;height:300px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(123,108,245,0.10),rgba(123,108,245,0));pointer-events:none;}
  .titlebar{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:flex-end;
    padding:0 10px;gap:2px;-webkit-app-region:drag;position:relative;z-index:2;}
  .winbtn{-webkit-app-region:no-drag;width:32px;height:28px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;color:#b0b0bb;cursor:pointer;font-size:15px;transition:all .12s;}
  .winbtn:hover{background:#f2f2f6;color:#555;}
  .winbtn.close:hover{background:#e81123;color:#fff;}
  .view{flex:1;display:flex;flex-direction:column;align-items:stretch;padding:2px 46px 0;position:relative;z-index:1;}
  .col{display:flex;flex-direction:column;align-items:center;}

    background-size:cover;filter:drop-shadow(0 14px 28px rgba(91,63,224,0.30));}
  .name{margin-top:20px;font-size:26px;font-weight:600;letter-spacing:.5px;color:#1a1a24;}
  .name .ver{font-size:13px;color:#c2c2cc;font-weight:400;margin-left:10px;letter-spacing:0;}
  .tag{margin-top:8px;font-size:13px;color:#9a9aa8;letter-spacing:.4px;}
  .btn{margin:28px auto 0;display:block;width:100%;max-width:320px;height:48px;border:none;border-radius:24px;
    color:#fff;font-size:16px;font-weight:500;letter-spacing:3px;cursor:pointer;position:relative;
    background:linear-gradient(135deg,#7e6ff6 0%,#5d4eec 100%);
    box-shadow:0 12px 26px rgba(93,78,236,0.34);transition:transform .12s,box-shadow .12s,filter .12s;}
  .btn:hover{filter:brightness(1.06);box-shadow:0 16px 32px rgba(93,78,236,0.42);}
  .btn:active{transform:translateY(1px);box-shadow:0 7px 16px rgba(93,78,236,0.30);}
  .btn.disabled{background:linear-gradient(135deg,#dcd7f6,#d2ccf3);box-shadow:none;cursor:not-allowed;filter:none;}
  .agree{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#8a8a98;cursor:pointer;}
  .agree input{width:15px;height:15px;accent-color:#6b5cf0;cursor:pointer;}
  .agree a{color:#6b5cf0;text-decoration:none;}
  .agree a:hover{text-decoration:underline;}
  .footer{margin-top:auto;padding:18px 0 24px;border-top:0.5px solid #f0f0f4;}
  .pathline{display:flex;align-items:center;gap:11px;}
  .pathlabel{font-size:12px;color:#82828f;white-space:nowrap;}
  .pathbox{flex:1;height:36px;border:1px solid #e7e7ef;border-radius:10px;background:#fafafc;
    display:flex;align-items:center;padding:0 13px;font-size:12px;color:#5a5a66;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color .12s;}
  .browse{height:36px;padding:0 18px;border:1px solid #e3e3ed;border-radius:10px;background:#fff;
    font-size:13px;color:#5a5a66;cursor:pointer;transition:all .12s;}
  .browse:hover{background:#f5f4fc;border-color:#cfc9ef;color:#6b5cf0;}
  .space{margin-top:12px;font-size:11px;color:#adadb9;letter-spacing:.2px;}
  .barwrap{margin-top:30px;height:8px;border-radius:5px;background:#eeeef4;overflow:hidden;}
  .bar{height:100%;width:0%;border-radius:5px;transition:width .3s ease;background:linear-gradient(90deg,#7e6ff6,#5d4eec);}
  .done-icon{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:42px;background:linear-gradient(150deg,#42d79e,#1d9e75);
    box-shadow:0 14px 30px rgba(29,158,117,0.30);}
  .bullets{margin-top:16px;font-size:13px;color:#8a8a98;line-height:2.05;text-align:left;}
  /* 完成页：精简版——一行小标签替代三条 bullet */
  .done-tag{margin-top:14px;font-size:13px;color:#9a9aa8;letter-spacing:.3px;}
  .done-path{margin-top:10px;font-size:12px;color:#adadb9;max-width:340px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  /* 已安装态：欢迎页顶部的小徽标 + 次按钮 */
  .badge{margin-top:14px;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:14px;
    background:#eef0fe;color:#5a4ed0;font-size:12px;font-weight:500;}
  .linkbtn{margin:14px auto 0;display:block;background:none;border:none;color:#8a8a98;font-size:12.5px;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .linkbtn:hover{color:#6b5cf0;}
  .hidden{display:none;}

<body>
<div class="card">
  <div class="titlebar">
    <div class="winbtn" id="min" title="最小化">&#8211;</div>
    <div class="winbtn close" id="close" title="关闭">&#10005;</div>
  </div>

  <div class="view" id="view-welcome">
    <div class="col">
      <div class="logo"></div>
      <div class="name">HashMM<span class="ver" id="ver">1.6.0</span></div>
      <div class="tag">本地优先 · AI 工作台</div>
      <div class="badge hidden" id="installed-badge">&#10003; 检测到已安装</div>
    </div>
    <button class="btn disabled" id="btn-install">立即安装</button>
    <button class="linkbtn hidden" id="btn-reinstall">重新安装到此位置</button>
    <label class="agree" id="agree-row">
      <input type="checkbox" id="agree" />
      <span>已阅读并同意 <a id="eula">《用户协议与隐私政策》</a></span>
    </label>
    <div class="footer">
      <div class="pathline">
        <span class="pathlabel">安装路径</span>
        <div class="pathbox" id="pathbox" title="">…</div>
        <button class="browse" id="browse">浏览</button>
      </div>
      <div class="space" id="space">安装所需空间：约 540 MB</div>
    </div>
  </div>

  <div class="view hidden" id="view-progress">
    <div class="col" style="margin-top:18px;">
      <div class="logo" style="width:72px;height:72px;border-radius:18px;"></div>
      <div class="name" style="font-size:18px;margin-top:18px;">正在安装 HashMM…</div>
      <div class="tag" id="prog-sub">正在准备文件</div>
    </div>
    <div class="barwrap"><div class="bar" id="bar"></div></div>
    <div style="margin-top:auto;"></div>
  </div>

  <div class="view hidden" id="view-done">
    <div class="col" style="margin-top:30px;">
      <div class="done-icon">&#10003;</div>
      <div class="name" style="font-size:21px;margin-top:22px;">安装完成</div>
      <div class="done-tag">本地运行 · 数据保留 · 不动系统</div>
      <div class="done-path" id="done-path"></div>
    </div>
    <button class="btn" id="btn-start" style="margin-bottom:30px;">开始使用</button>
  </div>
</div>
<script>
(function(){
  var API=window.hashmmInstaller||null;
  var installDir="",installedExe="",existing=null;
  var agree=document.getElementById("agree"),btn=document.getElementById("btn-install"),pathbox=document.getElementById("pathbox");
  function syncBtn(){ if(agree.checked) btn.classList.remove("disabled"); else btn.classList.add("disabled"); }
  agree.addEventListener("change",syncBtn); syncBtn();
  document.getElementById("min").onclick=function(){ API&&API.minimize(); };
  document.getElementById("close").onclick=function(){ API&&API.close(); };
  // 《用户协议与隐私政策》——可点，打开独立只读窗口
  document.getElementById("eula").onclick=function(e){ if(e)e.preventDefault(); API&&API.openEula&&API.openEula(); };

  function setInstallView(){ // 全新安装态：主按钮=立即安装（需勾选）
    btn.textContent="立即安装"; syncBtn();
    document.getElementById("btn-reinstall").classList.add("hidden");
    document.getElementById("installed-badge").classList.add("hidden");
    document.getElementById("agree-row").style.display="";
  }
  function setInstalledView(){ // 已安装态：主按钮=启动；提供"重新安装"次按钮；隐藏勾选
    document.getElementById("installed-badge").classList.remove("hidden");
    btn.textContent="启动 HashMM"; btn.classList.remove("disabled");
    document.getElementById("agree-row").style.display="none";
    document.getElementById("btn-reinstall").classList.remove("hidden");
  }

  if(API&&API.defaults){ API.defaults().then(function(d){
    installDir=d.installDir||""; pathbox.textContent=installDir; pathbox.title=installDir;
    var s="安装所需空间："+(d.sizeText||"约 540 MB"); if(d.freeText) s+=" · 可用空间："+d.freeText;
    document.getElementById("space").textContent=s;
    if(d.existing){ existing=d.existing; installedExe=d.existing.exe||""; setInstalledView(); }
    else { setInstallView(); }
  }); } else { pathbox.textContent="C:\\Users\\you\\AppData\\Local\\Programs\\HashMM"; }

  document.getElementById("browse").onclick=function(){ if(!API)return;
    API.browse(installDir).then(function(dir){ if(dir){ installDir=dir; pathbox.textContent=dir; pathbox.title=dir; } }); };
  if(API&&API.onProgress){ API.onProgress(function(p){
    document.getElementById("bar").style.width=(p.pct||0)+"%"; document.getElementById("prog-sub").textContent=p.stage||""; }); }

  function doInstall(){
    document.getElementById("view-welcome").classList.add("hidden");
    document.getElementById("view-progress").classList.remove("hidden");
    if(!API){ var p=0,b=document.getElementById("bar"); var t=setInterval(function(){p+=18;b.style.width=Math.min(100,p)+"%";if(p>=100){clearInterval(t);showDone();}},300); return; }
    API.install(installDir).then(function(r){
      if(r&&r.ok){ installedExe=r.installedExe||((r.installDir||"")+"\\HashMM.exe"); showDone(); }
      else { document.getElementById("view-progress").classList.add("hidden"); document.getElementById("view-welcome").classList.remove("hidden"); alert("安装失败："+((r&&r.error)||"未知错误")); }
    });
  }

  btn.onclick=function(){
    if(existing){ API&&API.launch(installedExe); return; }   // 已安装态：直接启动
    if(!agree.checked){ var l=document.getElementById("agree-row"); if(l&&l.animate) l.animate([{opacity:1},{opacity:.3},{opacity:1}],{duration:240,iterations:2}); return; }
    doInstall();
  };
  document.getElementById("btn-reinstall").onclick=function(){ existing=null; doInstall(); };

  function showDone(){
    document.getElementById("view-progress").classList.add("hidden");
    document.getElementById("view-done").classList.remove("hidden");
    if(installedExe){ var dir=installedExe.replace(/\\[^\\]*$/,""); document.getElementById("done-path").textContent="已安装到 "+dir; }
  }
  document.getElementById("btn-start").onclick=function(){ API&&API.launch(installedExe); };
})();
</script>
</body>
</html>

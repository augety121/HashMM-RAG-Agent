org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── HashMM App 的 Supabase 配置 ───────────────────────────────────────────────
# 开源版本不内置任何真实项目 key；请在未跟踪的 local.properties 中配置。
# ⚠️ SUPABASE_URL 必须指向你创建登录用户(admin@example.invalid)的同一个项目。
#    若要改用别的项目，改这里两行即可；也可在 local.properties 里写同名键覆盖。
SUPABASE_URL=
SUPABASE_PUBLISHABLE_KEY=
# 客户端默认地址，留空则首次进 App 在「设置」里填
DEFAULT_CLIENT_URL=

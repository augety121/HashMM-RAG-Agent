name: android-ci

# HashMM App CI（V308 新建 —— 此前项目【完全没有 CI】，且缺 gradlew/gradle-wrapper.jar，
# 新机器与 CI 都无法用标准命令复现构建）。
#
# 真门禁：任何步骤失败即 CI 红。不使用 continue-on-error / "|| true" 掩盖失败。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Wrapper 完整性校验：确保 gradle-wrapper.jar 未被篡改（供应链保护）
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests (JVM) —— 真门禁
        run: ./gradlew test --no-daemon --stacktrace

      - name: Lint —— 真门禁（报告落盘，失败即红）
        run: ./gradlew lint --no-daemon

      - name: Assemble debug APK —— 验证真能构建出包
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test reports
        if: always()          # 失败时也上传，便于排查
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

[versions]
# 与 HashLens 同一套工具链版本，确保在你现有 Android Studio 里可直接构建
agp = "9.0.0"
kotlin = "2.3.0"
ksp = "2.3.5"
compose-bom = "2026.01.01"
hilt = "2.59"
hilt-navigation = "1.3.0"
navigation = "2.9.7"
lifecycle = "2.10.0"
core-ktx = "1.17.0"
activity-compose = "1.12.3"
datastore = "1.1.7"
coroutines = "1.10.2"
serialization = "1.10.0"
okhttp = "4.12.0"
timber = "5.0.1"

# Supabase（仅用 Auth）— supabase-kt 3.x 必须配套 Ktor 3.x。
# 如遇编译错误去 https://github.com/supabase-community/supabase-kt/releases 查最新稳定版替换。
supabase = "3.2.2"
ktor = "3.1.3"
# WebRTC（远程控制投屏）——Stream 维护的 org.webrtc 预编译库，Maven Central。
# 如遇编译错误去 https://github.com/GetStream/webrtc-android/releases 查最新版替换。
webrtc = "1.3.10"

security-crypto = "1.1.0-alpha06"

[libraries]
# AndroidX Core
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

# Compose BOM
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-animation = { module = "androidx.compose.animation:animation" }

# Lifecycle
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Hilt（依赖注入，大厂标准）
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation" }

# DataStore（设置持久化）
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Coroutines
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# 序列化
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# OkHttp（WebSocket 信令）
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# WebRTC
webrtc = { module = "io.getstream:stream-webrtc-android", version.ref = "webrtc" }

# Supabase（仅 Auth）+ Ktor engine
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

# 日志
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

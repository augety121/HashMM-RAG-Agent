name: Private validation
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Reviewed private pull request number
        required: true
        default: '4'
        type: string
      source_sha:
        description: Reviewed private pull request full head commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.actor == 'augety121' && github.ref == 'refs/heads/main'
    environment: private-validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.suite == 'python' && 90 || 60 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [python, desktop-node, frontend, iteration]
        exclude:
          - os: windows-latest
            suite: frontend
    steps:
      - name: Verify reviewed private head
        shell: python
        env:
          READ_TOKEN: ${{ secrets.HASHMM_SOURCE_READ }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          import json, os, re, urllib.request
          try:
              sha = os.environ['SOURCE_SHA']
              number = os.environ['PR_NUMBER']
              assert re.fullmatch('[1-9][0-9]{0,8}', number)
              assert re.fullmatch('[0-9a-f]{40}', sha)
              assert os.environ['READ_TOKEN']
              assert os.environ.get('ACTIONS_STEP_DEBUG', '').lower() != 'true'
              req = urllib.request.Request('https://api.github.com/repos/augety121/hashmm/pulls/' + number, headers={'Authorization': 'Bearer ' + os.environ['READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  pr = json.load(response)
              assert pr['state'] == 'open' and pr['head']['sha'] == sha
              assert pr['head']['repo']['full_name'] == 'augety121/hashmm'
          except Exception:
              raise SystemExit('Private source admission failed; no source output published.')
      - uses: actions/checkout@v4
        with:
          repository: augety121/hashmm
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.HASHMM_SOURCE_READ }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full suite with private output
        id: private-suite
        shell: python
        env:
          SUITE: ${{ matrix.suite }}
          PYTHONUTF8: '1'
        run: |
          import os, pathlib, subprocess, sys
          # All child output stays on this ephemeral runner; never publish raw logs.
          env = dict(os.environ)
          for key in list(env):
              if key.startswith(('GITHUB_', 'ACTIONS_', 'RUNNER_')):
                  env.pop(key, None)
          env['CI'] = 'true'
          env['HASHMM_CI_RESULT_PATH'] = str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'hashmm-private-ci-result.json')
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'private-validation.log'
          try:
              with log.open('wb') as stream:
                  limit = 5100 if sys.platform == 'win32' and os.environ['SUITE'] == 'python' else 3300
                  code = subprocess.run([sys.executable, 'scripts/run-private-ci.py', os.environ['SUITE']], env=env, stdout=stream, stderr=subprocess.STDOUT, timeout=limit).returncode
          except Exception:
              code = 1
          print('Private suite passed.' if code == 0 else 'Private suite failed; raw output was not published.')
          raise SystemExit(0 if code == 0 else 1)
      - name: Send bounded diagnostic only to private commit status
        if: ${{ always() && steps.private-suite.outcome != 'skipped' }}
        shell: python
        env:
          STATUS_TOKEN: ${{ secrets.HASHMM_STATUS_WRITE }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SUITE: ${{ matrix.suite }}
          PLATFORM: ${{ matrix.os }}
          SUITE_OUTCOME: ${{ steps.private-suite.outcome }}
        run: |
          import json, os, pathlib, re, urllib.request
          # PRIVATE_DIAGNOSTIC_FUNCTION_BEGIN
          def diagnostic_failure_ids(report, suite, outcome):
              if outcome != 'failure' or suite not in {'python', 'desktop-node'} or not isinstance(report, dict):
                  return []
              if report.get('schema') != 'hashmm.private-ci-diagnostic.v1' or report.get('suite') != suite:
                  return []
              if suite == 'desktop-node':
                  steps = report.get('steps')
                  if not isinstance(steps, list) or len(steps) > 1000:
                      return []
                  result = []
                  for step in steps:
                      if (not isinstance(step, dict) or step.get('stage') != 'desktop-tests'
                              or step.get('status') not in {'failed', 'error'}):
                          continue
                      value = step.get('test_file')
                      if (isinstance(value, str) and len(value) <= 140 and re.fullmatch(
                              r'desktop/tests-node/[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*\.(?:js|cjs)', value)
                              and value not in result):
                          result.append(value)
                          if len(result) == 10:
                              break
                  return result
              steps, detail = report.get('steps'), report.get('pytest')
              if (not isinstance(steps, list) or len(steps) > 1000 or
                      not any(isinstance(step, dict) and step.get('stage') == 'pytest' and
                              step.get('status') in {'failed', 'error'} for step in steps) or
                      not isinstance(detail, dict) or detail.get('status') != 'available'):
                  return []
              identifiers = detail.get('test_ids')
              if not isinstance(identifiers, list):
                  return []
              result = []
              for value in identifiers[:10]:
                  if not isinstance(value, str) or len(value) > 1024:
                      continue
                  identifier = value.split('[', 1)[0]
                  if (len(identifier) <= 140 and re.fullmatch(
                          r'(?:tests\.)?test_[A-Za-z0-9_]+(?:\.[A-Za-z_][A-Za-z0-9_]*)*::test_[A-Za-z0-9_]+', identifier)
                          and identifier not in result):
                      result.append(identifier)
              return result

          def diagnostic_description(report, suite, outcome):
              if outcome == 'success':
                  return 'Private suite passed.'
              unavailable = 'Private suite failed; bounded diagnostic unavailable.'
              if not isinstance(report, dict) or report.get('schema') != 'hashmm.private-ci-diagnostic.v1' or report.get('suite') != suite:
                  return unavailable
              stages = {'dependencies', 'test-dependencies', 'lint-required', 'lint-advisory', 'cli-archive',
                        'pytest', 'contracts', 'compile', 'node-syntax', 'desktop-dependencies',
                        'frontend-dependencies', 'desktop-tests', 'typecheck', 'frontend-tests',
                        'frontend-build', 'iteration-tests', 'project-config'}
              steps = report.get('steps')
              if not isinstance(steps, list) or len(steps) > 1000:
                  return unavailable
              failed = [step for step in steps if isinstance(step, dict) and step.get('stage') in stages
                        and step.get('status') in {'failed', 'error', 'running'}]
              if not failed:
                  return unavailable
              stage = failed[0]['stage']
              description = stage + ': failed'
              detail = report.get('pytest')
              if stage == 'pytest' and isinstance(detail, dict) and detail.get('status') in {'available', 'in_progress', 'finishing'}:
                  if detail['status'] == 'available':
                      counts = [detail.get(key) for key in ('failed', 'errors')]
                      if all(type(value) is int and 0 <= value <= 1000000 for value in counts):
                          description = 'pytest: failed=' + str(counts[0]) + ' errors=' + str(counts[1])
                  else:
                      description = 'pytest: interrupted'
                      completed = detail.get('completed')
                      if type(completed) is int and 0 <= completed <= 1000000:
                          description += ' completed=' + str(completed)
                  identifiers = detail.get('test_ids')
                  if isinstance(identifiers, list):
                      for value in identifiers[:10]:
                          if isinstance(value, str) and len(value) <= 240 and re.fullmatch(r'(?:tests\.)?test_[A-Za-z0-9_]+(?:\.[A-Za-z_][A-Za-z0-9_]*)*::test_[A-Za-z0-9_]+', value):
                              description += ' ' + value
                              break
              return description[:140]

          def diagnostic_timing(report, suite, outcome, now):
              # Optional runner metadata only. No stack, source, test input,
              # free-form text, path or assertion body is admitted here.
              if (suite != 'python' or outcome == 'success' or not isinstance(report, dict)
                      or report.get('schema') != 'hashmm.private-ci-diagnostic.v1'
                      or report.get('suite') != suite):
                  return None
              detail = report.get('pytest')
              if not isinstance(detail, dict) or detail.get('status') != 'in_progress':
                  return None
              phase, started, seed = (detail.get(key) for key in ('phase', 'phase_started_at', 'random_seed'))
              if (phase not in ('setup', 'call', 'teardown') or type(started) is not int
                      or type(now) is not int or not 0 <= now - started <= 86400):
                  return None
              result = 'Interrupted phase=' + phase + ' elapsed=' + str(now - started) + 's'
              if type(seed) is int and 0 <= seed < 2**32:
                  result += ' random_seed=' + str(seed)
              return result
          # PRIVATE_DIAGNOSTIC_FUNCTION_END
          try:
              sha, suite, platform = os.environ['SOURCE_SHA'], os.environ['SUITE'], os.environ['PLATFORM']
              assert re.fullmatch('[0-9a-f]{40}', sha)
              assert suite in {'python', 'desktop-node', 'frontend', 'iteration'}
              assert platform in {'windows-latest', 'ubuntu-latest'}
              assert os.environ['STATUS_TOKEN']
              outcome = os.environ['SUITE_OUTCOME']
              assert outcome in {'success', 'failure', 'cancelled'}
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hashmm-private-ci-result.json'
              report = None
              if path.is_file() and not path.is_symlink() and path.stat().st_size <= 65536:
                  try:
                      report = json.loads(path.read_text(encoding='utf-8'))
                  except (ValueError, OSError):
                      pass
              # Never print the report, identifiers, payload, response or token.
              payload = {'state': 'success' if outcome == 'success' else 'failure',
                         'context': 'private-diagnostic/' + platform + '/' + suite,
                         'description': diagnostic_description(report, suite, outcome),
                         'target_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']}
              request = urllib.request.Request('https://api.github.com/repos/augety121/hashmm/statuses/' + sha,
                  data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['STATUS_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 201
              # Separate bounded private statuses preserve every admitted ID.
              # Run/attempt identity prevents stale slots from earlier runs.
              run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              assert re.fullmatch('[0-9]{1,20}', run_id) and re.fullmatch('[0-9]{1,10}', attempt)
              import time
              timing = diagnostic_timing(report, suite, outcome, int(time.time()))
              if timing is not None:
                  # Informational receipt; does not turn the failed suite green.
                  timing_payload = dict(payload, state='success', description=timing,
                      context='private-diagnostic/' + platform + '/' + suite + '/' + run_id + '-' + attempt + '/timing')
                  request = urllib.request.Request('https://api.github.com/repos/augety121/hashmm/statuses/' + sha,
                      data=json.dumps(timing_payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['STATUS_TOKEN'], 'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert response.status == 201
              for index, identifier in enumerate(diagnostic_failure_ids(report, suite, outcome), 1):
                  # Delivery receipts are informational; only the stable suite
                  # status controls failure, so later success can clear it.
                  detail_payload = dict(payload, state='success', description=identifier,
                      context='private-diagnostic/' + platform + '/' + suite + '/' + run_id + '-' + attempt + '/failure-' + str(index))
                  request = urllib.request.Request('https://api.github.com/repos/augety121/hashmm/statuses/' + sha,
                      data=json.dumps(detail_payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['STATUS_TOKEN'], 'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert response.status == 201
              print('Bounded diagnostic written to the private repository; no raw output published.')
          except Exception:
              raise SystemExit('Private diagnostic reporting failed; no raw output published.')
  report:
    if: always() && github.actor == 'augety121' && github.ref == 'refs/heads/main'
    needs: validate
    environment: private-validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report exact commit result to private repository
        shell: python
        env:
          STATUS_TOKEN: ${{ secrets.HASHMM_STATUS_WRITE }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESULT: ${{ needs.validate.result }}
        run: |
          import json, os, re, urllib.request
          try:
              sha = os.environ['SOURCE_SHA']
              assert re.fullmatch('[0-9a-f]{40}', sha)
              assert os.environ['STATUS_TOKEN']
              state = 'success' if os.environ['RESULT'] == 'success' else 'failure'
              data = json.dumps({'state': state, 'context': 'public-runner/private-full-matrix', 'description': 'Seven private suites: ' + state, 'target_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']}).encode()
              req = urllib.request.Request('https://api.github.com/repos/augety121/hashmm/statuses/' + sha, data=data, headers={'Authorization': 'Bearer ' + os.environ['STATUS_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  assert response.status == 201
          except Exception:
              raise SystemExit('Private status reporting failed.')
